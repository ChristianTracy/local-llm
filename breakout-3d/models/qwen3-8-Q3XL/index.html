<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #03050c;
    overflow: hidden;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap {
    position: relative;
    width: 800px; height: 600px;
    box-shadow: 0 0 60px rgba(40, 90, 255, 0.25), 0 0 0 1px rgba(90, 140, 255, 0.15);
    border-radius: 8px;
    overflow: hidden;
  }
  canvas { display: block; }
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 10px 16px;
    pointer-events: none;
    z-index: 5;
  }
  #scoreWrap {
    color: #bfe3ff; font-size: 18px; font-weight: 700;
    letter-spacing: 2px;
    text-shadow: 0 0 12px rgba(80, 170, 255, 0.8);
  }
  #score {
    display: inline-block;
    min-width: 56px;
    color: #ffffff;
    text-align: right;
  }
  #score.pop { animation: scorePop 0.25s ease-out; }
  @keyframes scorePop {
    0%   { transform: scale(1);    color: #ffffff; }
    40%  { transform: scale(1.45); color: #9feaff; }
    100% { transform: scale(1);    color: #ffffff; }
  }
  #lives {
    color: #ff5277; font-size: 20px; letter-spacing: 4px;
    text-shadow: 0 0 10px rgba(255, 80, 120, 0.8);
  }
  #lives .empty { color: rgba(255, 255, 255, 0.22); text-shadow: none; }
  #rightHud { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  #camMode {
    color: #7fd4ff; font-size: 12px; font-weight: 700; letter-spacing: 2px;
    text-shadow: 0 0 8px rgba(80, 170, 255, 0.7);
  }
  #mute { font-size: 16px; filter: drop-shadow(0 0 6px rgba(120, 200, 255, 0.6)); }
  #overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(4, 7, 16, 0.55);
    z-index: 10;
    backdrop-filter: blur(2px);
  }
  #overlay.hidden { display: none; }
  #screen { text-align: center; padding: 0 32px; }
  #title {
    font-size: 58px; font-weight: 900; letter-spacing: 10px;
    background: linear-gradient(180deg, #9feaff 0%, #4fc3f7 45%, #6a5cff 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    filter: drop-shadow(0 0 18px rgba(80, 160, 255, 0.55));
    margin-bottom: 18px;
  }
  #subtitle {
    color: #eaf6ff; font-size: 17px; font-weight: 700; letter-spacing: 5px;
    animation: blink 1.1s ease-in-out infinite;
    margin-bottom: 26px;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.15; }
  }
  #hints {
    display: inline-block;
    text-align: left;
    color: #8fb8dd; font-size: 13px; line-height: 1.9; letter-spacing: 1px;
    border: 1px solid rgba(110, 170, 255, 0.25);
    border-radius: 10px;
    padding: 12px 22px;
    background: rgba(10, 18, 40, 0.55);
  }
  #hints b { color: #cfeaff; font-weight: 700; }
</style>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div style="display:flex;flex-direction:column;gap:4px;">
      <div id="scoreWrap">SCORE <span id="score">0</span></div>
      <div id="lives"></div>
    </div>
    <div id="rightHud">
      <div id="camMode">CAM: AUTO</div>
      <div id="mute">🔊</div>
    </div>
  </div>
  <div id="overlay">
    <div id="screen">
      <h1 id="title">BREAKOUT 3D</h1>
      <div id="subtitle">PRESS SPACE</div>
      <div id="hints">
        <b>← / → or A / D</b> — move paddle<br>
        <b>SPACE</b> — launch / pause<br>
        <b>C</b> — camera mode &nbsp; <b>R</b> — reset camera<br>
        <b>M</b> — mute
      </div>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ============================================================
// Constants
// ============================================================
const W = 800, H = 600;
const LEFT = -6, RIGHT = 6, TOP = 8, FLOOR_Y = -6;
const PADDLE_Y = -4.5;
const PADDLE_W = 2.4, PADDLE_H = 0.3, PADDLE_D = 0.8;
const PADDLE_SPEED = 11;
const BALL_R = 0.25;
const BALL_SPEED = 16;
const BRICK_COLS = 8, BRICK_ROWS = 5;
const BRICK_W = 1.3, BRICK_H = 0.55, BRICK_D = 0.9;
const BRICK_X0 = -5.25, BRICK_DX = 1.5;
const BRICK_Y0 = 4.5, BRICK_DY = 0.85;
const ROW_COLORS = [0xff5252, 0xffb74d, 0xffd54f, 0x66bb6a, 0x4fc3f7];
const CAM_BASE = new THREE.Vector3(0, 9, 14);
const CAM_TARGET = new THREE.Vector3(0, 1, 0);

const STATE = { START: 0, READY: 1, PLAYING: 2, PAUSED: 3, GAMEOVER: 4, VICTORY: 5 };

// ============================================================
// Renderer / Scene / Camera
// ============================================================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('wrap').prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080f);
scene.fog = new THREE.Fog(0x06080f, 38, 75);

const camera = new THREE.PerspectiveCamera(60, W / H, 0.1, 100);
camera.position.copy(CAM_BASE);
camera.lookAt(CAM_TARGET);

// ============================================================
// Lighting
// ============================================================
scene.add(new THREE.AmbientLight(0x404040, 1.2));

const sun = new THREE.DirectionalLight(0xffffff, 1.7);
sun.position.set(6, 16, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -10;
sun.shadow.camera.right = 10;
sun.shadow.camera.top = 12;
sun.shadow.camera.bottom = -10;
sun.shadow.camera.near = 2;
sun.shadow.camera.far = 45;
sun.shadow.bias = -0.0003;
sun.shadow.normalBias = 0.02;
scene.add(sun);

const rim = new THREE.DirectionalLight(0x4a6cff, 0.5);
rim.position.set(-8, 4, -10);
scene.add(rim);

const ballLight = new THREE.PointLight(0x66d9ff, 1.2, 9, 2);
ballLight.position.set(0, PADDLE_Y + 0.3, 1.5);
scene.add(ballLight);

// ============================================================
// Procedural textures
// ============================================================
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

const floorTex = canvasTex(512, 512, (g) => {
  g.fillStyle = '#0d1226';
  g.fillRect(0, 0, 512, 512);
  const glow = g.createRadialGradient(256, 256, 0, 256, 256, 256);
  glow.addColorStop(0, 'rgba(70, 110, 220, 0.38)');
  glow.addColorStop(0.5, 'rgba(35, 60, 140, 0.14)');
  glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
  g.fillStyle = glow;
  g.fillRect(0, 0, 512, 512);
  g.strokeStyle = 'rgba(90, 120, 220, 0.10)';
  g.lineWidth = 1;
  for (let i = 0; i <= 512; i += 32) {
    g.beginPath(); g.moveTo(i + 0.5, 0); g.lineTo(i + 0.5, 512); g.stroke();
    g.beginPath(); g.moveTo(0, i + 0.5); g.lineTo(512, i + 0.5); g.stroke();
  }
  g.strokeStyle = 'rgba(120, 160, 255, 0.24)';
  g.lineWidth = 1.5;
  for (let i = 0; i <= 512; i += 64) {
    g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 512); g.stroke();
    g.beginPath(); g.moveTo(0, i); g.lineTo(512, i); g.stroke();
  }
  const vig = g.createRadialGradient(256, 256, 170, 256, 256, 370);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.8)');
  g.fillStyle = vig;
  g.fillRect(0, 0, 512, 512);
});

function hexToRgb(hex) {
  return [(hex >> 16) & 255, (hex >> 8) & 255, hex & 255];
}

function brickTexture(rowColor) {
  return canvasTex(256, 96, (g) => {
    const [r, gg, b] = hexToRgb(rowColor);
    g.fillStyle = `rgb(${r},${gg},${b})`;
    g.fillRect(0, 0, 256, 96);
    const gloss = g.createLinearGradient(0, 0, 0, 96);
    gloss.addColorStop(0, 'rgba(255,255,255,0.55)');
    gloss.addColorStop(0.35, 'rgba(255,255,255,0.08)');
    gloss.addColorStop(0.7, 'rgba(0,0,0,0.08)');
    gloss.addColorStop(1, 'rgba(0,0,0,0.38)');
    g.fillStyle = gloss;
    g.fillRect(0, 0, 256, 96);
    for (let i = 0; i < 40; i++) {
      const x = Math.random() * 256;
      const y = Math.random() * 96;
      const len = 6 + Math.random() * 26;
      g.strokeStyle = `rgba(255,255,255,${0.03 + Math.random() * 0.08})`;
      g.lineWidth = 1 + Math.random() * 1.5;
      g.beginPath();
      g.moveTo(x, y);
      g.lineTo(x + len * 0.3, y - len);
      g.stroke();
    }
    g.strokeStyle = 'rgba(255,255,255,0.5)';
    g.lineWidth = 3;
    g.beginPath(); g.moveTo(2, 2); g.lineTo(254, 2); g.stroke();
    g.beginPath(); g.moveTo(2, 2); g.lineTo(2, 94); g.stroke();
    g.strokeStyle = 'rgba(0,0,0,0.45)';
    g.beginPath(); g.moveTo(254, 2); g.lineTo(254, 94); g.stroke();
    g.beginPath(); g.moveTo(2, 94); g.lineTo(254, 94); g.stroke();
  });
}

const paddleTex = canvasTex(256, 64, (g) => {
  const grad = g.createLinearGradient(0, 0, 0, 64);
  grad.addColorStop(0, '#9feaff');
  grad.addColorStop(0.5, '#29c7ff');
  grad.addColorStop(1, '#0a6fa8');
  g.fillStyle = grad;
  g.fillRect(0, 0, 256, 64);
  g.fillStyle = 'rgba(255,255,255,0.55)';
  g.fillRect(0, 28, 256, 8);
  g.fillStyle = 'rgba(255,255,255,0.35)';
  g.fillRect(0, 0, 256, 4);
  g.fillStyle = 'rgba(10,60,110,0.55)';
  g.fillRect(0, 60, 256, 4);
  g.fillStyle = 'rgba(255,255,255,0.75)';
  g.fillRect(18, 8, 6, 48);
  g.fillRect(232, 8, 6, 48);
});

const backdropTex = canvasTex(1024, 512, (g) => {
  const grad = g.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0, '#0a1028');
  grad.addColorStop(0.55, '#070b1c');
  grad.addColorStop(1, '#03050c');
  g.fillStyle = grad;
  g.fillRect(0, 0, 1024, 512);
  const blobs = [
    { x: 260, y: 200, r: 240, c: 'rgba(90, 60, 220, 0.16)' },
    { x: 700, y: 140, r: 280, c: 'rgba(40, 120, 255, 0.14)' },
    { x: 520, y: 380, r: 300, c: 'rgba(20, 200, 220, 0.10)' },
  ];
  for (const bl of blobs) {
    const rad = g.createRadialGradient(bl.x, bl.y, 0, bl.x, bl.y, bl.r);
    rad.addColorStop(0, bl.c);
    rad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rad;
    g.fillRect(0, 0, 1024, 512);
  }
});

// ============================================================
// Environment: floor, backdrop, stars, border frame
// ============================================================
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(46, 46),
  new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.9, metalness: 0.1 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = FLOOR_Y;
floor.receiveShadow = true;
scene.add(floor);

const backdrop = new THREE.Mesh(
  new THREE.PlaneGeometry(220, 110),
  new THREE.MeshBasicMaterial({ map: backdropTex, fog: false })
);
backdrop.position.set(0, 8, -48);
scene.add(backdrop);

{
  const N = 260;
  const pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    pos[i * 3 + 0] = (Math.random() - 0.5) * 120;
    pos[i * 3 + 1] = -8 + Math.random() * 48;
    pos[i * 3 + 2] = -60 + Math.random() * 44;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const stars = new THREE.Points(geo, new THREE.PointsMaterial({
    color: 0xcfe4ff, size: 0.18, sizeAttenuation: true,
    transparent: true, opacity: 0.8, fog: false
  }));
  scene.add(stars);
}

{
  const pts = [
    new THREE.Vector3(LEFT, FLOOR_Y, 0),
    new THREE.Vector3(RIGHT, FLOOR_Y, 0),
    new THREE.Vector3(RIGHT, TOP, 0),
    new THREE.Vector3(LEFT, TOP, 0),
  ];
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const frame = new THREE.LineLoop(geo, new THREE.LineBasicMaterial({
    color: 0x35548a, transparent: true, opacity: 0.7
  }));
  scene.add(frame);
}

// ============================================================
// Paddle / Ball / Bricks
// ============================================================
const paddle = new THREE.Mesh(
  new RoundedBoxGeometry(PADDLE_W, PADDLE_H, PADDLE_D, 4, 0.1),
  new THREE.MeshStandardMaterial({ map: paddleTex, roughness: 0.35, metalness: 0.3, emissive: 0x0a3a55, emissiveIntensity: 0.5 })
);
paddle.position.set(0, PADDLE_Y, 0);
paddle.castShadow = true;
scene.add(paddle);

const ball = new THREE.Mesh(
  new THREE.SphereGeometry(BALL_R, 28, 20),
  new THREE.MeshStandardMaterial({ color: 0xeaf6ff, roughness: 0.25, metalness: 0.1, emissive: 0x66d9ff, emissiveIntensity: 0.4 })
);
ball.castShadow = true;
scene.add(ball);

const ballVel = new THREE.Vector3(0, 0, 0);

const brickGeo = new RoundedBoxGeometry(BRICK_W, BRICK_H, BRICK_D, 4, 0.08);
const rowTextures = ROW_COLORS.map(brickTexture);
const bricks = [];
for (let row = 0; row < BRICK_ROWS; row++) {
  for (let col = 0; col < BRICK_COLS; col++) {
    const mat = new THREE.MeshStandardMaterial({
      map: rowTextures[row],
      roughness: 0.45,
      metalness: 0.15,
      emissive: new THREE.Color(ROW_COLORS[row]),
      emissiveIntensity: 0
    });
    const m = new THREE.Mesh(brickGeo, mat);
    m.position.set(BRICK_X0 + col * BRICK_DX, BRICK_Y0 - row * BRICK_DY, 0);
    m.castShadow = true;
    scene.add(m);
    bricks.push({ mesh: m, row, alive: true, dying: false, dieT: 0 });
  }
}

// ============================================================
// Ball trail
// ============================================================
const TRAIL_N = 12;
const TRAIL_STEP = 3;
const trailGroup = new THREE.Group();
scene.add(trailGroup);
const trailGhosts = [];
for (let i = 0; i < TRAIL_N; i++) {
  const g = new THREE.Mesh(
    new THREE.SphereGeometry(BALL_R * (1 - i / (TRAIL_N + 3)), 14, 10),
    new THREE.MeshBasicMaterial({ color: 0x66d9ff, transparent: true, opacity: 0, depthWrite: false })
  );
  g.visible = false;
  trailGroup.add(g);
  trailGhosts.push(g);
}
const trailBuf = [];
let trailFrame = 0;

// ============================================================
// Particles
// ============================================================
const MAX_PARTICLES = 120;
const particleGeo = new THREE.SphereGeometry(0.06, 8, 6);
const particles = [];
for (let i = 0; i < MAX_PARTICLES; i++) {
  const p = new THREE.Mesh(particleGeo, new THREE.MeshBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0, depthWrite: false
  }));
  p.visible = false;
  scene.add(p);
  particles.push({ mesh: p, vel: new THREE.Vector3(), life: 0, maxLife: 0.7 });
}
let particleCursor = 0;

function spawnBurst(x, y, color) {
  for (let i = 0; i < 10; i++) {
    const p = particles[particleCursor];
    particleCursor = (particleCursor + 1) % MAX_PARTICLES;
    p.mesh.visible = true;
    p.mesh.material.color.setHex(color);
    p.mesh.material.opacity = 1;
    p.mesh.position.set(x, y, 0);
    const a = Math.random() * Math.PI * 2;
    const s = 2 + Math.random() * 4;
    p.vel.set(Math.cos(a) * s, Math.sin(a) * s + 1.5, (Math.random() - 0.5) * 1.5);
    p.life = p.maxLife = 0.5 + Math.random() * 0.3;
  }
}

function updateParticles(dt) {
  for (const p of particles) {
    if (!p.mesh.visible) continue;
    p.life -= dt;
    if (p.life <= 0) { p.mesh.visible = false; p.mesh.material.opacity = 0; continue; }
    p.vel.y -= 12 * dt;
    p.mesh.position.addScaledVector(p.vel, dt);
    p.mesh.material.opacity = Math.min(1, p.life / p.maxLife);
  }
}

// ============================================================
// Audio (Web Audio oscillators)
// ============================================================
let actx = null;
let muted = false;

function ensureAudio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) actx = new AC();
  }
  if (actx && actx.state === 'suspended') actx.resume();
}

function beep(freq, type, dur, vol, delay = 0) {
  if (!actx || muted) return;
  const t = actx.currentTime + delay;
  const layers = [[freq, 1], [freq * 2, 0.25]];
  for (const [f, v] of layers) {
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type;
    o.frequency.value = f;
    g.gain.setValueAtTime(vol * v, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(actx.destination);
    o.start(t);
    o.stop(t + dur + 0.03);
  }
}

const sfx = {
  paddle: () => beep(880, 'square', 0.07, 0.18),
  brick: () => beep(660, 'triangle', 0.09, 0.22),
  lifeLost: () => beep(220, 'sawtooth', 0.35, 0.22),
  victory: () => {
    beep(523, 'sine', 0.14, 0.2, 0);
    beep(659, 'sine', 0.14, 0.2, 0.12);
    beep(784, 'sine', 0.2, 0.2, 0.24);
  }
};

// ============================================================
// HUD
// ============================================================
const elScore = document.getElementById('score');
const elLives = document.getElementById('lives');
const elCamMode = document.getElementById('camMode');
const elMute = document.getElementById('mute');
const elOverlay = document.getElementById('overlay');
const elTitle = document.getElementById('title');
const elSubtitle = document.getElementById('subtitle');
const elHints = document.getElementById('hints');

let score = 0;
let lives = 3;

function setScore(v, pop = true) {
  score = v;
  elScore.textContent = String(score);
  if (pop) {
    elScore.classList.remove('pop');
    void elScore.offsetWidth;
    elScore.classList.add('pop');
  }
}

function setLives(v) {
  lives = v;
  let html = '';
  for (let i = 0; i < 3; i++) {
    html += i < lives ? '♥' : '<span class="empty">·</span>';
  }
  elLives.innerHTML = html;
}

function setCamModeLabel() {
  elCamMode.textContent = cameraMode === 'auto' ? 'CAM: AUTO' : 'CAM: MANUAL';
}

function setMuteLabel() {
  elMute.textContent = muted ? '🔇' : '🔊';
}

function showOverlay(title, subtitle, hintsHtml) {
  elTitle.textContent = title;
  elSubtitle.textContent = subtitle;
  elHints.innerHTML = hintsHtml;
  elOverlay.classList.remove('hidden');
}

function hideOverlay() {
  elOverlay.classList.add('hidden');
}

const HINTS_MAIN =
  '<b>← / → or A / D</b> — move paddle<br>' +
  '<b>SPACE</b> — launch / pause<br>' +
  '<b>C</b> — camera mode &nbsp; <b>R</b> — reset camera<br>' +
  '<b>M</b> — mute';
const HINTS_END =
  '<b>ANY KEY or CLICK</b> — back to title';

// ============================================================
// Game state
// ============================================================
let state = STATE.START;
let stateLock = 0;
let elapsed = 0;
let paddleHitT = 0;
let shakeTime = 0;
let launchYOffset = 0;

// Camera
let cameraMode = 'auto';
let autoCamX = 0;
let yaw = 0, pitch = 0.519, dist = 16.16;
const MANUAL_DEFAULTS = { yaw: 0, pitch: 0.519, dist: 16.16 };

function resetBallOnPaddle() {
  ball.position.set(paddle.position.x, PADDLE_Y + PADDLE_H / 2 + BALL_R, 0);
  ballVel.set(0, 0, 0);
  trailBuf.length = 0;
  for (const g of trailGhosts) g.visible = false;
}

function setState(s) {
  state = s;
  stateLock = 0.5;
  switch (s) {
    case STATE.START:
      showOverlay('BREAKOUT 3D', 'PRESS SPACE', HINTS_MAIN);
      break;
    case STATE.READY:
      resetBallOnPaddle();
      hideOverlay();
      break;
    case STATE.PLAYING:
      hideOverlay();
      break;
    case STATE.PAUSED:
      showOverlay('PAUSED', 'PRESS SPACE TO RESUME', HINTS_MAIN);
      break;
    case STATE.GAMEOVER:
      showOverlay('GAME OVER', `SCORE ${score}`, HINTS_END);
      break;
    case STATE.VICTORY:
      showOverlay('VICTORY', `SCORE ${score}`, HINTS_END);
      sfx.victory();
      break;
  }
}

function fullReset() {
  setScore(0, false);
  setLives(3);
  for (const b of bricks) {
    b.alive = true;
    b.dying = false;
    b.dieT = 0;
    b.mesh.visible = true;
    b.mesh.scale.setScalar(1);
    b.mesh.material.emissiveIntensity = 0;
  }
  paddle.position.set(0, PADDLE_Y, 0);
  paddle.scale.setScalar(1);
  paddleHitT = 0;
  shakeTime = 0;
  launchYOffset = 0;
  resetBallOnPaddle();
  for (const p of particles) { p.mesh.visible = false; p.mesh.material.opacity = 0; }
  if (cameraMode === 'auto') autoCamX = 0;
  else { yaw = MANUAL_DEFAULTS.yaw; pitch = MANUAL_DEFAULTS.pitch; dist = MANUAL_DEFAULTS.dist; }
  setState(STATE.START);
}

function loseLife() {
  setLives(lives - 1);
  shakeTime = 0.35;
  sfx.lifeLost();
  if (lives <= 0) setState(STATE.GAMEOVER);
  else setState(STATE.READY);
}

function destroyBrick(b) {
  b.alive = false;
  b.dying = true;
  b.dieT = 0.25;
  setScore(score + 10);
  sfx.brick();
  spawnBurst(b.mesh.position.x, b.mesh.position.y, ROW_COLORS[b.row]);
  if (bricks.every((x) => !x.alive)) {
    setState(STATE.VICTORY);
  }
}

// ============================================================
// Input
// ============================================================
const keys = new Set();

function toggleCameraMode() {
  if (cameraMode === 'auto') {
    // Take over current auto camera position without a jump
    const off = camera.position.clone().sub(CAM_TARGET);
    dist = THREE.MathUtils.clamp(off.length(), 8, 30);
    pitch = THREE.MathUtils.clamp(Math.asin(THREE.MathUtils.clamp(off.y / dist, -1, 1)), 0.08, 1.35);
    yaw = Math.atan2(off.x, off.z);
    cameraMode = 'manual';
  } else {
    cameraMode = 'auto';
  }
  setCamModeLabel();
}

function resetCamera() {
  if (cameraMode === 'auto') autoCamX = 0;
  else { yaw = MANUAL_DEFAULTS.yaw; pitch = MANUAL_DEFAULTS.pitch; dist = MANUAL_DEFAULTS.dist; }
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') e.preventDefault();
  ensureAudio();
  if (e.repeat) return;
  keys.add(e.code);

  if (stateLock > 0) return;

  if (state === STATE.GAMEOVER || state === STATE.VICTORY) {
    fullReset();
    return;
  }

  switch (e.code) {
    case 'Space':
      if (state === STATE.START) setState(STATE.READY);
      else if (state === STATE.READY) {
        const a = (Math.random() - 0.5) * 0.5;
        ballVel.set(Math.sin(a) * BALL_SPEED, Math.cos(a) * BALL_SPEED, 0);
        launchYOffset = 0.3;
        setState(STATE.PLAYING);
      } else if (state === STATE.PLAYING) setState(STATE.PAUSED);
      else if (state === STATE.PAUSED) setState(STATE.PLAYING);
      break;
    case 'KeyC':
      toggleCameraMode();
      break;
    case 'KeyR':
      resetCamera();
      break;
    case 'KeyM':
      muted = !muted;
      setMuteLabel();
      break;
  }
});

window.addEventListener('keyup', (e) => keys.delete(e.code));

// Manual camera: drag orbit + wheel zoom
let dragging = false;
let lastX = 0, lastY = 0;

renderer.domElement.addEventListener('mousedown', (e) => {
  ensureAudio();
  if (state === STATE.GAMEOVER || state === STATE.VICTORY) { fullReset(); return; }
  if (cameraMode !== 'manual') return;
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});
window.addEventListener('mousemove', (e) => {
  if (!dragging || cameraMode !== 'manual') return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;
  yaw -= dx * 0.005;
  pitch = THREE.MathUtils.clamp(pitch + dy * 0.005, 0.08, 1.35);
});
window.addEventListener('mouseup', () => { dragging = false; });
renderer.domElement.addEventListener('wheel', (e) => {
  if (cameraMode !== 'manual') return;
  e.preventDefault();
  dist = THREE.MathUtils.clamp(dist * (1 + e.deltaY * 0.001), 8, 30);
}, { passive: false });

// ============================================================
// Physics
// ============================================================
function stepBall(dt) {
  const travel = BALL_SPEED * dt;
  const steps = Math.max(1, Math.ceil(travel / 0.12));
  const sdt = dt / steps;

  for (let s = 0; s < steps; s++) {
    ball.position.addScaledVector(ballVel, sdt);

    // Walls
    if (ball.position.x - BALL_R < LEFT) {
      ball.position.x = LEFT + BALL_R;
      ballVel.x = Math.abs(ballVel.x);
    } else if (ball.position.x + BALL_R > RIGHT) {
      ball.position.x = RIGHT - BALL_R;
      ballVel.x = -Math.abs(ballVel.x);
    }
    if (ball.position.y + BALL_R > TOP) {
      ball.position.y = TOP - BALL_R;
      ballVel.y = -Math.abs(ballVel.y);
    }

    // Paddle
    if (ballVel.y < 0) {
      const top = PADDLE_Y + PADDLE_H / 2;
      if (
        ball.position.y - BALL_R <= top &&
        ball.position.y - BALL_R >= PADDLE_Y - 0.4 &&
        Math.abs(ball.position.x - paddle.position.x) <= PADDLE_W / 2 + BALL_R
      ) {
        const offset = THREE.MathUtils.clamp((ball.position.x - paddle.position.x) / (PADDLE_W / 2), -1, 1);
        const angle = offset * (Math.PI / 3);
        ballVel.set(Math.sin(angle) * BALL_SPEED, Math.cos(angle) * BALL_SPEED, 0);
        ball.position.y = top + BALL_R;
        paddleHitT = 0.1;
        sfx.paddle();
      }
    }

    // Bricks
    for (const b of bricks) {
      if (!b.alive) continue;
      const dx = ball.position.x - b.mesh.position.x;
      const dy = ball.position.y - b.mesh.position.y;
      const hx = BRICK_W / 2 + BALL_R;
      const hy = BRICK_H / 2 + BALL_R;
      if (Math.abs(dx) < hx && Math.abs(dy) < hy) {
        const px = hx - Math.abs(dx);
        const py = hy - Math.abs(dy);
        if (px < py) {
          ballVel.x = (dx >= 0 ? 1 : -1) * Math.max(Math.abs(ballVel.x), 0.5);
          ball.position.x = b.mesh.position.x + (dx >= 0 ? hx : -hx);
        } else {
          ballVel.y = (dy >= 0 ? 1 : -1) * Math.max(Math.abs(ballVel.y), 0.5);
          ball.position.y = b.mesh.position.y + (dy >= 0 ? hy : -hy);
        }
        destroyBrick(b);
        if (state !== STATE.PLAYING) return;
        break;
      }
    }

    // Floor
    if (ball.position.y - BALL_R < FLOOR_Y) {
      loseLife();
      return;
    }
  }

  // Anti-stall
  if (Math.abs(ballVel.y) < 1.5) {
    ballVel.y = (ballVel.y >= 0 ? 1 : -1) * 1.5;
  }
}

// ============================================================
// Main loop
// ============================================================
const clock = new THREE.Clock();

function update(dt) {
  if (stateLock > 0) stateLock -= dt;

  // Paddle movement
  if (state === STATE.READY || state === STATE.PLAYING) {
    let dir = 0;
    if (keys.has('ArrowLeft') || keys.has('KeyA')) dir -= 1;
    if (keys.has('ArrowRight') || keys.has('KeyD')) dir += 1;
    paddle.position.x = THREE.MathUtils.clamp(
      paddle.position.x + dir * PADDLE_SPEED * dt,
      LEFT + PADDLE_W / 2,
      RIGHT - PADDLE_W / 2
    );
  }

  // Paddle squash/stretch
  if (paddleHitT > 0) {
    paddleHitT = Math.max(0, paddleHitT - dt);
    const s = Math.sin((1 - paddleHitT / 0.1) * Math.PI);
    paddle.scale.set(1 + 0.22 * s, 1 - 0.3 * s, 1);
  } else {
    paddle.scale.set(1, 1, 1);
  }

  // Ball
  if (state === STATE.READY) {
    ball.position.set(paddle.position.x, PADDLE_Y + PADDLE_H / 2 + BALL_R, 0);
  } else if (state === STATE.PLAYING) {
    stepBall(dt);
    if (state === STATE.PLAYING) {
      ball.material.emissiveIntensity = 0.4 + 0.35 * (0.5 + 0.5 * Math.sin(elapsed * 8));
    }
  } else {
    ball.material.emissiveIntensity = 0.4;
  }

  // Ball light follows ball
  ballLight.position.set(ball.position.x, ball.position.y + 0.3, 1.5);

  // Trail
  const trailActive = state === STATE.PLAYING;
  if (trailActive) {
    trailFrame++;
    trailBuf.push(ball.position.clone());
    if (trailBuf.length > TRAIL_N * TRAIL_STEP) trailBuf.shift();
    for (let i = 0; i < TRAIL_N; i++) {
      const idx = trailBuf.length - 1 - (i + 1) * TRAIL_STEP;
      const g = trailGhosts[i];
      if (idx >= 0) {
        g.visible = true;
        g.position.copy(trailBuf[idx]);
        g.material.opacity = (1 - i / TRAIL_N) * 0.3;
      } else {
        g.visible = false;
        g.material.opacity = 0;
      }
    }
  } else {
    for (const g of trailGhosts) { g.visible = false; g.material.opacity = 0; }
  }

  // Dying bricks
  for (const b of bricks) {
    if (!b.dying) continue;
    b.dieT -= dt;
    if (b.dieT <= 0) {
      b.dying = false;
      b.mesh.visible = false;
      b.mesh.scale.setScalar(1);
      b.mesh.material.emissiveIntensity = 0;
    } else {
      const k = b.dieT / 0.25;
      b.mesh.scale.setScalar(Math.max(0.001, k));
      b.mesh.material.emissiveIntensity = 2 * (1 - k) + 0.3;
    }
  }

  updateParticles(dt);

  // Launch Y offset decay
  launchYOffset *= Math.exp(-dt * 3);

  // Shake
  if (shakeTime > 0) shakeTime = Math.max(0, shakeTime - dt);

  // Camera
  if (cameraMode === 'auto') {
    autoCamX += (paddle.position.x * 0.25 - autoCamX) * Math.min(1, dt * 4);
    camera.position.set(
      autoCamX + (CAM_BASE.x - 0),
      CAM_BASE.y + launchYOffset,
      CAM_BASE.z
    );
    camera.lookAt(CAM_TARGET);
  } else {
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    camera.position.set(
      CAM_TARGET.x + dist * cp * Math.sin(yaw),
      CAM_TARGET.y + dist * sp,
      CAM_TARGET.z + dist * cp * Math.cos(yaw)
    );
    camera.lookAt(CAM_TARGET);
  }
  if (shakeTime > 0) {
    const a = shakeTime / 0.35;
    const m = 0.35 * a * a;
    camera.position.x += (Math.random() - 0.5) * m;
    camera.position.y += (Math.random() - 0.5) * m;
    camera.position.z += (Math.random() - 0.5) * m;
  }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  update(dt);
  renderer.render(scene, camera);
}

// ============================================================
// Init
// ============================================================
setScore(0, false);
setLives(3);
setCamModeLabel();
setMuteLabel();
resetBallOnPaddle();
setState(STATE.START);
animate();
</script>
</body>
</html>
