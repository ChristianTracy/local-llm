<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D Breakout</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #06080f; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  #game { position: fixed; inset: 0; display: block; }

  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 14px 22px; display: flex; justify-content: space-between;
    align-items: flex-start; pointer-events: none; z-index: 10;
    color: #e8f4ff; text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    font-size: 15px; letter-spacing: 0.5px;
  }
  #hud .left { display: flex; flex-direction: column; gap: 4px; }
  #scoreWrap { display: flex; align-items: baseline; gap: 8px; }
  #scoreLabel { font-size: 13px; opacity: 0.7; text-transform: uppercase; letter-spacing: 2px; }
  #score { font-size: 30px; font-weight: 700; transition: transform 0.12s ease, color 0.12s; }
  #score.pop { transform: scale(1.35); color: #ffd54f; }
  #lives { font-size: 20px; letter-spacing: 3px; margin-top: 2px; }
  #lives .heart { color: #ff5252; }
  #lives .dot { opacity: 0.25; }
  #right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
    font-size: 13px; opacity: 0.85; text-align: right; }
  #right .row { display: flex; align-items: center; gap: 6px; }
  #camInd { color: #66d9ff; font-weight: 600; }
  #muteInd { font-size: 16px; }

  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 20;
    background: radial-gradient(ellipse at center, rgba(10,16,40,0.55), rgba(3,5,12,0.9));
    color: #e8f4ff; text-align: center; pointer-events: auto;
    transition: opacity 0.3s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #title {
    font-size: 64px; font-weight: 800; letter-spacing: 4px;
    background: linear-gradient(90deg,#ff5252,#ffb74d,#ffd54f,#66bb6a,#4fc3f7);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 18px rgba(79,195,247,0.35)); margin-bottom: 6px;
  }
  #subtitle { font-size: 20px; opacity: 0.9; margin-bottom: 34px; }
  #subtitle.blink { animation: blink 1.1s steps(2, start) infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
  #hints {
    display: flex; gap: 26px; margin-top: 8px;
    font-size: 14px; opacity: 0.8;
  }
  #hints .hint { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #hints .key {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 26px; padding: 4px 8px; border-radius: 7px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(120,200,255,0.3);
    font-weight: 600; font-size: 13px; color: #9feaff;
  }
  #hints .lbl { opacity: 0.7; font-size: 12px; margin-top: 2px; }
  #subTitle2 { font-size: 16px; opacity: 0.75; margin-top: 22px; }
</style>
</head>
<body>
<div id="game"></div>

<div id="hud">
  <div class="left">
    <div id="scoreWrap">
      <span id="scoreLabel">Score</span>
      <span id="score">0</span>
    </div>
    <div id="lives"></div>
  </div>
  <div id="right">
    <div class="row"><span>Camera</span><span id="camInd">AUTO</span></div>
    <div class="row"><span id="muteInd">🔊</span></div>
  </div>
</div>

<div id="overlay">
  <div id="title">BREAKOUT 3D</div>
  <div id="subtitle" class="blink">Press SPACE to start</div>
  <div id="hints">
    <div class="hint"><span class="key">◀ ▶</span><span class="lbl">Move</span></div>
    <div class="hint"><span class="key">A D</span><span class="lbl">Move</span></div>
    <div class="hint"><span class="key">Space</span><span class="lbl">Launch / Pause</span></div>
    <div class="hint"><span class="key">C</span><span class="lbl">Cam</span></div>
    <div class="hint"><span class="key">R</span><span class="lbl">Reset Cam</span></div>
    <div class="hint"><span class="key">M</span><span class="lbl">Mute</span></div>
  </div>
  <div id="subTitle2"></div>
</div>

<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============================================================
   3D BREAKOUT — single file
   ============================================================ */

// ---------- Constants ----------
const W = 800, H = 600;
const LEFT = -6, RIGHT = 6, TOP = 8, FLOOR_Y = -6;
const PADDLE_Y = -4.5;
const PADDLE_W = 2.4, PADDLE_H = 0.3, PADDLE_D = 0.8;
const PADDLE_SPEED = 11;
const BALL_R = 0.25;
const BALL_SPEED = 16;
const PADDLE_MIN = LEFT + 1.2, PADDLE_MAX = RIGHT - 1.2;

const BRICK_COLS = 8, BRICK_ROWS = 5;
const BRICK_W = 1.3, BRICK_H = 0.55, BRICK_D = 0.9;
const BRICK_X_START = -5.25, BRICK_X_SPACING = 1.5;
const BRICK_Y_START = 4.5, BRICK_Y_SPACING = 0.85;
const BRICK_COLORS = [0xff5252, 0xffb74d, 0xffd54f, 0x66bb6a, 0x4fc3f7];

const STATE = { START: 'START', READY: 'READY', PLAYING: 'PLAYING',
  PAUSED: 'PAUSED', GAMEOVER: 'GAMEOVER', VICTORY: 'VICTORY' };

// ---------- DOM ----------
const gameEl = document.getElementById('game');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const camIndEl = document.getElementById('camInd');
const muteIndEl = document.getElementById('muteInd');
const overlay = document.getElementById('overlay');
const titleEl = document.getElementById('title');
const subtitleEl = document.getElementById('subtitle');
const subTitle2El = document.getElementById('subTitle2');

// ---------- Three.js setup ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
gameEl.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080f);
scene.fog = new THREE.Fog(0x06080f, 38, 75);

const camera = new THREE.PerspectiveCamera(60, W / H, 0.1, 100);
const CAMERA_BASE = new THREE.Vector3(0, 9, 14);
const CAMERA_TARGET = new THREE.Vector3(0, 1, 0);

// ---------- Lighting ----------
const ambient = new THREE.AmbientLight(0x404040, 1.2);
scene.add(ambient);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.7);
dirLight.position.set(6, 16, 9);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.left = -10;
dirLight.shadow.camera.right = 10;
dirLight.shadow.camera.top = 12;
dirLight.shadow.camera.bottom = -10;
dirLight.shadow.camera.near = 2;
dirLight.shadow.camera.far = 45;
dirLight.shadow.bias = -0.0003;
dirLight.shadow.normalBias = 0.02;
scene.add(dirLight);

const rimLight = new THREE.DirectionalLight(0x4a6cff, 0.5);
rimLight.position.set(-8, 4, -10);
scene.add(rimLight);

const ballLight = new THREE.PointLight(0x66d9ff, 1.2, 9, 2);
ballLight.position.set(0, 0, 1.5);
scene.add(ballLight);

// ---------- Materials ----------
const ballMat = new THREE.MeshStandardMaterial({
  color: 0xffffff, emissive: 0x66d9ff, emissiveIntensity: 0.6,
  metalness: 0.2, roughness: 0.35
});
const ballMesh = new THREE.Mesh(new THREE.SphereGeometry(BALL_R, 32, 32), ballMat);
ballMesh.castShadow = true;
scene.add(ballMesh);

const paddleMat = new THREE.MeshStandardMaterial({
  color: 0xffffff, emissive: 0x1a3a5a, emissiveIntensity: 0.3,
  metalness: 0.3, roughness: 0.4
});
const paddleMesh = new THREE.Mesh(
  new RoundedBoxGeometry(PADDLE_W, PADDLE_H, PADDLE_D, 4, 0.1), paddleMat);
paddleMesh.castShadow = true;
paddleMesh.receiveShadow = true;
scene.add(paddleMesh);

// ---------- Floor ----------
const floorTex = makeFloorTexture();
const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.85, metalness: 0.05 });
const floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(46, 46), floorMat);
floorMesh.rotation.x = -Math.PI / 2;
floorMesh.position.y = FLOOR_Y;
floorMesh.receiveShadow = true;
scene.add(floorMesh);

// ---------- Border frame ----------
const borderPts = [
  new THREE.Vector3(LEFT, TOP, 0), new THREE.Vector3(RIGHT, TOP, 0),
  new THREE.Vector3(RIGHT, FLOOR_Y, 0), new THREE.Vector3(LEFT, FLOOR_Y, 0)
];
const borderGeo = new THREE.EdgesGeometry(new THREE.PlaneGeometry(RIGHT - LEFT, TOP - FLOOR_Y));
const borderMat = new THREE.LineBasicMaterial({ color: 0x2a4a7a, transparent: true, opacity: 0.55 });
const borderLine = new THREE.LineLoop(borderGeo, borderMat);
borderLine.position.set(0, (TOP + FLOOR_Y) / 2, 0);
scene.add(borderLine);

// ---------- Backdrop ----------
const backdropTex = makeBackdropTexture();
const backdropMat = new THREE.MeshBasicMaterial({ map: backdropTex });
const backdropMesh = new THREE.Mesh(new THREE.PlaneGeometry(220, 110), backdropMat);
backdropMesh.position.set(0, 8, -48);
backdropMesh.material.fog = false;
scene.add(backdropMesh);

// ---------- Starfield ----------
const starGeo = new THREE.BufferGeometry();
const starCount = 260;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  starPos[i * 3] = (Math.random() - 0.5) * 90;
  starPos[i * 3 + 1] = Math.random() * 40 - 5;
  starPos[i * 3 + 2] = -30 - Math.random() * 30;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({ color: 0x9fd8ff, size: 0.25, transparent: true, opacity: 0.8 });
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// ---------- Brick textures ----------
const brickMats = BRICK_COLORS.map(hex => new THREE.MeshStandardMaterial({
  map: makeBrickTextureForColor(hex), emissive: 0xffffff, emissiveIntensity: 0,
  metalness: 0.1, roughness: 0.5
}));

// ---------- Bricks ----------
let bricks = [];
let brickGroups = [];

function buildBricks() {
  // clear existing
  brickGroups.forEach(g => scene.remove(g));
  brickGroups = [];
  bricks = [];
  for (let r = 0; r < BRICK_ROWS; r++) {
    const row = [];
    for (let c = 0; c < BRICK_COLS; c++) {
      const geo = new RoundedBoxGeometry(BRICK_W, BRICK_H, BRICK_D, 4, 0.08);
      const mesh = new THREE.Mesh(geo, brickMats[r]);
      mesh.position.set(
        BRICK_X_START + c * BRICK_X_SPACING,
        BRICK_Y_START - r * BRICK_Y_SPACING,
        0
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      const box = new THREE.Box3().setFromObject(mesh);
      row.push({ mesh, box, alive: true, row: r, anim: 0 });
    }
    bricks.push(row);
  }
}

// ---------- Ball trail ----------
const TRAIL_LEN = 12;
const trailMeshes = [];
for (let i = 0; i < TRAIL_LEN; i++) {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(BALL_R * (1 - i * 0.06), 16, 16),
    new THREE.MeshStandardMaterial({
      color: 0x66d9ff, emissive: 0x66d9ff, emissiveIntensity: 0.5,
      transparent: true, opacity: 0
    })
  );
  m.visible = false;
  scene.add(m);
  trailMeshes.push(m);
}

// ---------- Particles ----------
const particles = [];
function spawnParticles(pos, color, count = 10) {
  for (let i = 0; i < count; i++) {
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(0.09, 8, 8),
      new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.8 })
    );
    m.position.copy(pos);
    m.userData.vel = new THREE.Vector3(
      (Math.random() - 0.5) * 6,
      Math.random() * 5 + 1,
      (Math.random() - 0.5) * 3
    );
    m.userData.life = 1;
    m.castShadow = false;
    scene.add(m);
    particles.push(m);
  }
}

// ============================================================
// TEXTURE GENERATORS
// ============================================================
function makeFloorTexture() {
  const size = 512;
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  // base
  ctx.fillStyle = '#0d1226';
  ctx.fillRect(0, 0, size, size);
  // central radial glow
  const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size*0.6);
  g.addColorStop(0, 'rgba(40,80,160,0.45)');
  g.addColorStop(1, 'rgba(10,20,40,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  // fine subgrid 32px
  ctx.strokeStyle = 'rgba(90,140,220,0.10)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= size; i += 32) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, size); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(size, i); ctx.stroke();
  }
  // main grid 64px
  ctx.strokeStyle = 'rgba(120,170,240,0.22)';
  ctx.lineWidth = 1.5;
  for (let i = 0; i <= size; i += 64) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, size); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(size, i); ctx.stroke();
  }
  // edge vignette
  const v = ctx.createRadialGradient(size/2, size/2, size*0.35, size/2, size/2, size*0.72);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.65)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

function makeBrickTextureForColor(hex) {
  const w = 256, h = 96;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const r = (hex >> 16) & 0xff, g = (hex >> 8) & 0xff, b = hex & 0xff;
  // base
  ctx.fillStyle = `rgb(${r},${g},${b})`;
  ctx.fillRect(0, 0, w, h);
  // vertical gloss gradient (bright top -> dark bottom)
  const grd = ctx.createLinearGradient(0, 0, 0, h);
  grd.addColorStop(0, `rgba(255,255,255,0.45)`);
  grd.addColorStop(0.4, `rgba(255,255,255,0)`);
  grd.addColorStop(1, `rgba(0,0,0,0.45)`);
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, w, h);
  // random white streaks
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 40; i++) {
    const x = Math.random() * w;
    ctx.beginPath();
    ctx.moveTo(x, 2 + Math.random() * 4);
    ctx.lineTo(x + (Math.random() - 0.5) * 8, 4 + Math.random() * (h - 8));
    ctx.stroke();
  }
  // bevel border stroke
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 4;
  ctx.strokeRect(2, 2, w - 4, h - 4);
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 2;
  ctx.strokeRect(4, 4, w - 8, h - 8);
  const tex = new THREE.CanvasTexture(cv);
  return tex;
}

function makePaddleTexture() {
  const w = 256, h = 64;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const grd = ctx.createLinearGradient(0, 0, 0, h);
  grd.addColorStop(0, '#9feaff');
  grd.addColorStop(0.5, '#29c7ff');
  grd.addColorStop(1, '#0a6fa8');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, w, h);
  // center stripe
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillRect(w * 0.35, 0, w * 0.3, h);
  // two edge accents
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillRect(0, 0, w * 0.12, h);
  ctx.fillRect(w * 0.88, 0, w * 0.12, h);
  const tex = new THREE.CanvasTexture(cv);
  return tex;
}

function makeBackdropTexture() {
  const w = 1024, h = 512;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const grd = ctx.createLinearGradient(0, 0, 0, h);
  grd.addColorStop(0, '#0a1028');
  grd.addColorStop(0.55, '#070b1c');
  grd.addColorStop(1, '#03050c');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, w, h);
  // 3 soft nebula radial blobs
  const blobs = [
    [220, 150, 260, 'rgba(79,195,247,0.28)'],
    [720, 300, 300, 'rgba(102,187,106,0.20)'],
    [520, 90, 240, 'rgba(255,183,77,0.16)']
  ];
  blobs.forEach(([x, y, r, col]) => {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, col);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  });
  const tex = new THREE.CanvasTexture(cv);
  return tex;
}

// rebuild bricks with per-row materials
buildBricks();

const paddleTex = makePaddleTexture();
paddleMat.map = paddleTex;
paddleMat.needsUpdate = true;

// ============================================================
// AUDIO (Web Audio oscillators)
// ============================================================
let audioCtx = null;
let muted = false;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, type, dur, vol, delay = 0) {
  if (!audioCtx || muted) return;
  const t = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(vol, t + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur + 0.02);
  // octave layer at 25% volume
  const osc2 = audioCtx.createOscillator();
  const gain2 = audioCtx.createGain();
  osc2.type = type; osc2.frequency.setValueAtTime(freq * 2, t);
  gain2.gain.setValueAtTime(0.0001, t);
  gain2.gain.exponentialRampToValueAtTime(vol * 0.25, t + 0.005);
  gain2.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc2.connect(gain2).connect(audioCtx.destination);
  osc2.start(t); osc2.stop(t + dur + 0.02);
}
function soundPaddle() { beep(880, 'square', 0.07, 0.18); }
function soundBrick() { beep(660, 'triangle', 0.09, 0.22); }
function soundLifeLost() { beep(220, 'sawtooth', 0.35, 0.22); }
function soundVictory() {
  beep(523, 'sine', 0.14, 0.22, 0);
  beep(659, 'sine', 0.14, 0.22, 0.12);
  beep(784, 'sine', 0.20, 0.22, 0.24);
}

// ============================================================
// GAME STATE
// ============================================================
let state = STATE.START;
let score = 0;
let lives = 3;
let camMode = 'AUTO'; // 'AUTO' | 'MANUAL'

const ballVel = new THREE.Vector3();
let ballOnPaddle = true;

// auto camera orbit (manual mode)
let yaw = 0, pitch = 0.519, dist = 16.16;
const MANUAL_TARGET = new THREE.Vector3(0, 1, 0);
const MANUAL_DEFAULT = { yaw: 0, pitch: 0.519, dist: 16.16 };

let shakeTime = 0;
const shakeAmp = 0.35;
let autoYOffset = 0;

// paddle squash
let squashT = 0;

// animation
let elapsed = 0;
const clock = new THREE.Clock();

// input
const keys = {};
let mouseDown = false, dragX = 0, dragY = 0;
let lastDragX = 0, lastDragY = 0;

// ============================================================
// HUD
// ============================================================
function updateHUD() {
  scoreEl.textContent = score;
  let html = '';
  for (let i = 0; i < lives; i++) html += '<span class="heart">♥</span>';
  for (let i = lives; i < 3; i++) html += '<span class="dot">·</span>';
  livesEl.innerHTML = html;
  camIndEl.textContent = camMode === 'AUTO' ? 'AUTO' : 'MANUAL';
  muteIndEl.textContent = muted ? '🔇' : '🔊';
}
function popScore() {
  scoreEl.classList.remove('pop');
  void scoreEl.offsetWidth;
  scoreEl.classList.add('pop');
}

function showOverlay(title, sub, sub2 = '') {
  titleEl.textContent = title;
  subtitleEl.textContent = sub;
  subtitleEl.classList.toggle('blink', sub.includes('space') || sub.includes('SPACE') || sub.includes('Press'));
  subTitle2El.textContent = sub2;
  overlay.classList.remove('hidden');
}
function hideOverlay() {
  overlay.classList.add('hidden');
}

// ============================================================
// GAME FLOW
// ============================================================
function resetGame() {
  score = 0; lives = 3;
  buildBricks();
  resetBallOnPaddle();
  ballVel.set(0, 0, 0);
  ballOnPaddle = true;
  paddleMesh.position.x = 0;
  trailMeshes.forEach(m => { m.visible = false; m.material.opacity = 0; });
  particles.forEach(p => scene.remove(p));
  particles.length = 0;
  autoYOffset = 0;
  updateHUD();
}

function resetBallOnPaddle() {
  ballOnPaddle = true;
  ballVel.set(0, 0, 0);
  ballMesh.position.set(paddleMesh.position.x, PADDLE_Y - BALL_R - PADDLE_H / 2, 0);
}

function launchBall() {
  ballOnPaddle = false;
  const a = (Math.random() - 0.5) * 0.5;
  ballVel.set(Math.sin(a) * BALL_SPEED, Math.cos(a) * BALL_SPEED, 0);
  autoYOffset = 0.3;
}

function transition(next) {
  state = next;
  if (next === STATE.READY) { resetBallOnPaddle(); showOverlay('BREAKOUT 3D', 'Press SPACE to launch', ''); }
  else if (next === STATE.PLAYING) { hideOverlay(); }
  else if (next === STATE.PAUSED) { showOverlay('PAUSED', 'Press SPACE to resume', ''); }
  else if (next === STATE.GAMEOVER) { showOverlay('GAME OVER', 'Press any key', 'Final score: ' + score); }
  else if (next === STATE.VICTORY) { soundVictory(); showOverlay('VICTORY!', 'Press any key', 'Score: ' + score); }
  else if (next === STATE.START) { showOverlay('BREAKOUT 3D', 'Press SPACE to start', ''); }
}

// ============================================================
// PHYSICS HELPERS
// ============================================================
const _box = new THREE.Box3();
const _center = new THREE.Vector3();
const _half = new THREE.Vector3();
const _rel = new THREE.Vector3();
const _normal = new THREE.Vector3();

function reflectBall(face) {
  // face: 'left'|'right'|'top'|'bottom'
  if (face === 'left') { ballVel.x = Math.abs(ballVel.x); }
  else if (face === 'right') { ballVel.x = -Math.abs(ballVel.x); }
  else if (face === 'top') { ballVel.y = Math.abs(ballVel.y); }
  else if (face === 'bottom') { ballVel.y = -Math.abs(ballVel.y); }
}

// ============================================================
// UPDATE
// ============================================================
function update(dt) {
  elapsed += dt;

  // Paddle movement
  let dir = 0;
  if (keys['arrowleft'] || keys['a']) dir -= 1;
  if (keys['arrowright'] || keys['d']) dir += 1;
  paddleMesh.position.x += dir * PADDLE_SPEED * dt;
  paddleMesh.position.x = Math.max(PADDLE_MIN, Math.min(PADDLE_MAX, paddleMesh.position.x));

  // Squash decay (0.1s sine stretch)
  if (squashT > 0) squashT = Math.max(0, squashT - dt / 0.1);
  const sqF = squashT > 0 ? Math.sin((1 - squashT) * Math.PI) : 0;
  paddleMesh.scale.set(1 - sqF * 0.15, 1 + sqF * 0.15, 1);

  // Ball on paddle
  if (ballOnPaddle) {
    ballMesh.position.x = paddleMesh.position.x;
    ballMesh.position.y = PADDLE_Y - BALL_R - PADDLE_H / 2;
  }

  if (state === STATE.PLAYING) {
    // Move ball
    ballMesh.position.addScaledVector(ballVel, dt);

    // Anti-stall
    if (Math.abs(ballVel.y) < 1.5) {
      ballVel.y = ballVel.y >= 0 ? 1.5 : -1.5;
    }

    // Wall collisions
    const bx = ballMesh.position.x, by = ballMesh.position.y;
    if (bx - BALL_R < LEFT) { ballMesh.position.x = LEFT + BALL_R; reflectBall('left'); }
    if (bx + BALL_R > RIGHT) { ballMesh.position.x = RIGHT - BALL_R; reflectBall('right'); }
    if (by + BALL_R > TOP) { ballMesh.position.y = TOP - BALL_R; reflectBall('top'); }

    // Floor / life lost
    if (by < FLOOR_Y + BALL_R) {
      loseLife();
      return;
    }

    // Paddle collision (ball moving downward) — plane-crossing, tunnel-safe
    if (ballVel.y < 0) {
      const halfW = PADDLE_W / 2 + BALL_R;
      if (Math.abs(ballMesh.position.x - paddleMesh.position.x) < halfW) {
        const topOfPaddle = paddleMesh.position.y + PADDLE_H / 2;
        if (ballMesh.position.y - BALL_R < topOfPaddle) {
          ballMesh.position.y = topOfPaddle + BALL_R;
          const offset = Math.max(-1, Math.min(1,
            (ballMesh.position.x - paddleMesh.position.x) / (PADDLE_W / 2)));
          const ang = offset * (Math.PI / 180) * 60;
          ballVel.set(Math.sin(ang) * BALL_SPEED, Math.cos(ang) * BALL_SPEED, 0);
          squashT = 1;
          soundPaddle();
        }
      }
    }

    // Brick collisions
    handleBrickCollisions();

    // Check victory
    if (bricks.every(row => row.every(b => !b.alive))) {
      state = STATE.VICTORY;
      transition(STATE.VICTORY);
      return;
    }

    // Trail
    updateTrail();

    // Ball light + emissive pulse
    ballLight.position.set(ballMesh.position.x, ballMesh.position.y + 0.3, 1.5);
    ballMat.emissiveIntensity = 0.4 + 0.35 * (0.5 + 0.5 * Math.sin(elapsed * 8));

    // Auto camera Y offset decay
    autoYOffset *= Math.exp(-dt * 3);
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.userData.vel.y -= 12 * dt;
    p.position.addScaledVector(p.userData.vel, dt);
    p.userData.life -= dt * 1.6;
    p.material.opacity = Math.max(0, p.userData.life);
    p.material.transparent = true;
    p.scale.setScalar(Math.max(0.01, p.userData.life));
    if (p.userData.life <= 0) {
      scene.remove(p);
      particles.splice(i, 1);
    }
  }

  // Camera shake decay
  if (shakeTime > 0) shakeTime = Math.max(0, shakeTime - dt);

  // Camera
  updateCamera(dt);

  // Starfield slow drift
  stars.rotation.y += dt * 0.01;
}

function handleBrickCollisions() {
  const bx = ballMesh.position.x, by = ballMesh.position.y;
  const bvx = ballVel.x, bvy = ballVel.y;

  // find closest alive brick via AABB; determine reflection face by least penetration
  let hit = null;
  let best = Infinity;
  for (let r = 0; r < BRICK_ROWS; r++) {
    for (let c = 0; c < BRICK_COLS; c++) {
      const b = bricks[r][c];
      if (!b.alive) continue;
      const box = b.box;
      // expand brick box by ball radius for sphere-AABB
      const nx = Math.max(box.min.x, Math.min(bx, box.max.x));
      const ny = Math.max(box.min.y, Math.min(by, box.max.y));
      const dx = bx - nx, dy = by - ny;
      const distSq = dx * dx + dy * dy;
      if (distSq < BALL_R * BALL_R && distSq < best) {
        best = distSq;
        hit = b;
      }
    }
  }

  if (hit) {
    // Determine face by penetration depth
    const box = hit.box;
    const penLeft = bx - BALL_R - box.min.x;
    const penRight = box.max.x + BALL_R - bx;
    const penTop = by + BALL_R - box.max.y;
    const penBottom = box.min.y - BALL_R - by;
    const px = Math.min(penLeft, penRight);
    const py = Math.min(penTop, penBottom);
    if (px < py) {
      ballVel.x = -ballVel.x;
      ballMesh.position.x += (bvx > 0 ? -1 : 1) * (px + 0.01);
    } else {
      ballVel.y = -ballVel.y;
      ballMesh.position.y += (bvy > 0 ? -1 : 1) * (py + 0.01);
    }
    destroyBrick(hit);
  }
}

function destroyBrick(b) {
  b.alive = false;
  b.anim = 1; // start death anim
  score += 10;
  popScore();
  soundBrick();
  spawnParticles(b.mesh.position.clone(), BRICK_COLORS[b.row], 10);
  // animate later
  b.deadT = 0;
}

function updateDeathAnimations(dt) {
  for (let r = 0; r < BRICK_ROWS; r++) {
    for (let c = 0; c < BRICK_COLS; c++) {
      const b = bricks[r][c];
      if (b.alive) continue;
      if (b.deadT === undefined) b.deadT = 0;
      b.deadT += dt;
      const t = b.deadT;
      if (t < 0.25) {
        const s = 1 - t / 0.25;
        b.mesh.scale.setScalar(s);
        b.mesh.material.emissiveIntensity = (0.25 - t) / 0.25 * 1.5;
      } else {
        b.mesh.visible = false;
        b.mesh.material.emissiveIntensity = 0;
      }
    }
  }
}

function updateTrail() {
  for (let i = TRAIL_LEN - 1; i >= 0; i--) {
    const m = trailMeshes[i];
    m.position.copy(ballMesh.position);
    m.material.opacity = (1 - i / TRAIL_LEN) * 0.4;
    m.visible = true;
  }
}

function loseLife() {
  lives--;
  updateHUD();
  soundLifeLost();
  shakeTime = 0.35;
  autoYOffset = 0.3;
  if (lives <= 0) {
    state = STATE.GAMEOVER;
    transition(STATE.GAMEOVER);
  } else {
    state = STATE.READY;
    transition(STATE.READY);
    resetBallOnPaddle();
  }
}

// ============================================================
// CAMERA
// ============================================================
function updateCamera(dt) {
  if (camMode === 'AUTO') {
    // lerp X toward paddle.x*0.25
    const tx = CAMERA_BASE.x + paddleMesh.position.x * 0.25;
    const factor = Math.min(1, dt * 4);
    camera.position.x += (tx - camera.position.x) * factor;
    camera.position.set(
      camera.position.x,
      CAMERA_BASE.y + 0.3 - autoYOffset,
      CAMERA_BASE.z
    );
    camera.lookAt(CAMERA_TARGET.x, CAMERA_TARGET.y, CAMERA_TARGET.z);
  } else {
    // manual orbit
    const x = MANUAL_TARGET.x + dist * Math.sin(yaw) * Math.cos(pitch);
    const y = MANUAL_TARGET.y + dist * Math.cos(pitch);
    const z = MANUAL_TARGET.z + dist * Math.sin(pitch);
    camera.position.set(x, y, z);
    camera.lookAt(MANUAL_TARGET.x, MANUAL_TARGET.y, MANUAL_TARGET.z);
  }

  // apply shake
  if (shakeTime > 0) {
    const s = shakeTime / 0.35;
    camera.position.x += (Math.random() - 0.5) * shakeAmp * s;
    camera.position.y += (Math.random() - 0.5) * shakeAmp * s;
  }
}

// ============================================================
// INPUT
// ============================================================
window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  ensureAudio();

  // GAMEOVER / VICTORY: any key (or click) resets to START
  if (state === STATE.GAMEOVER || state === STATE.VICTORY) {
    e.preventDefault();
    resetGame();
    state = STATE.START;
    transition(STATE.START);
    return;
  }

  if (k === ' ') {
    e.preventDefault();
    if (state === STATE.START) transition(STATE.READY);
    else if (state === STATE.READY) { state = STATE.PLAYING; transition(STATE.PLAYING); launchBall(); }
    else if (state === STATE.PLAYING) { state = STATE.PAUSED; transition(STATE.PAUSED); }
    else if (state === STATE.PAUSED) { state = STATE.PLAYING; transition(STATE.PLAYING); }
  } else if (k === 'c') {
    if (camMode === 'AUTO') {
      camMode = 'MANUAL';
      // take over current auto camera position
      const dir = camera.position.clone().sub(MANUAL_TARGET);
      const d = dir.length();
      dist = d;
      yaw = Math.atan2(dir.z, dir.x);
      pitch = Math.acos(Math.max(-1, Math.min(1, dir.y / d)));
    } else {
      camMode = 'AUTO';
    }
    updateHUD();
  } else if (k === 'r') {
    if (camMode === 'MANUAL') { yaw = MANUAL_DEFAULT.yaw; pitch = MANUAL_DEFAULT.pitch; dist = MANUAL_DEFAULT.dist; }
    else { /* reset auto */ }
    updateHUD();
  } else if (k === 'm') {
    muted = !muted;
    updateHUD();
  }
});
window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

// mouse drag for manual orbit
gameEl.addEventListener('mousedown', (e) => {
  if (state === STATE.GAMEOVER || state === STATE.VICTORY) return;
  mouseDown = true; lastDragX = e.clientX; lastDragY = e.clientY;
});
window.addEventListener('mouseup', () => { mouseDown = false; });
gameEl.addEventListener('click', () => {
  if (state === STATE.GAMEOVER || state === STATE.VICTORY) {
    resetGame();
    state = STATE.START;
    transition(STATE.START);
  }
});
window.addEventListener('mousemove', (e) => {
  if (!mouseDown || camMode !== 'MANUAL') return;
  const dx = (e.clientX - lastDragX) * 0.005;
  const dy = (e.clientY - lastDragY) * 0.005;
  yaw -= dx;
  pitch = Math.max(0.08, Math.min(1.35, pitch + dy));
  lastDragX = e.clientX; lastDragY = e.clientY;
});
gameEl.addEventListener('wheel', (e) => {
  if (camMode !== 'MANUAL') return;
  dist = Math.max(8, Math.min(30, dist + e.deltaY * 0.01));
}, { passive: true });

// first gesture unlock
['click', 'keydown', 'touchstart'].forEach(ev =>
  window.addEventListener(ev, ensureAudio, { once: true }));

// ============================================================
// RESIZE
// ============================================================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================
// MAIN LOOP
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (state !== STATE.PLAYING) {
    updateDeathAnimations(dt);
    trailMeshes.forEach(m => { m.visible = false; m.material.opacity = 0; });
  } else {
    update(dt);
    updateDeathAnimations(dt);
  }
  renderer.render(scene, camera);
}

// ============================================================
// INIT
// ============================================================
buildBricks();
resetGame();
transition(STATE.START);
animate();

</script>
