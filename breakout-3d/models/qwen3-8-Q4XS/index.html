<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Breakout</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #03050c;
    overflow: hidden;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #stage {
    position: relative;
    width: 800px; height: 600px;
    max-width: 100vw; max-height: 100vh;
    box-shadow: 0 0 60px rgba(40, 80, 200, 0.25);
    border: 1px solid rgba(80, 130, 255, 0.18);
    border-radius: 6px;
    overflow: hidden;
  }
  #stage canvas { display: block; width: 800px; height: 600px; }

  /* ---------- HUD ---------- */
  #hud {
    position: absolute; inset: 0;
    pointer-events: none;
    color: #cfe4ff;
    text-shadow: 0 0 8px rgba(80, 150, 255, 0.6);
    font-size: 16px;
    letter-spacing: 1px;
  }
  #score {
    position: absolute; top: 12px; left: 16px;
    font-size: 22px; font-weight: 700;
    color: #9fdcff;
    display: inline-block;
  }
  #score.pop { animation: pop 0.25s ease-out; }
  @keyframes pop {
    0%   { transform: scale(1);    color: #ffffff; }
    40%  { transform: scale(1.45); color: #ffffff; }
    100% { transform: scale(1);    color: #9fdcff; }
  }
  #lives {
    position: absolute; top: 12px; right: 16px;
    font-size: 20px; font-weight: 700;
    color: #ff6b81;
    text-shadow: 0 0 8px rgba(255, 80, 110, 0.7);
  }
  #lives .off { color: #3a4668; text-shadow: none; }
  #cammode {
    position: absolute; top: 38px; right: 16px;
    font-size: 12px; color: #7f9fd4;
  }
  #muteind {
    position: absolute; top: 38px; left: 16px;
    font-size: 13px; color: #7f9fd4;
  }

  /* ---------- Overlay ---------- */
  #overlay {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(6,10,24,0.55) 0%, rgba(3,5,12,0.88) 100%);
    pointer-events: none;
    text-align: center;
  }
  #overlay.show { display: flex; }
  #ovl-title {
    font-size: 52px; font-weight: 800;
    letter-spacing: 6px;
    background: linear-gradient(180deg, #cfeaff 0%, #4fc3f7 45%, #7b5cff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 18px rgba(80, 160, 255, 0.55));
    margin-bottom: 18px;
  }
  #ovl-sub {
    font-size: 18px;
    color: #dceaff;
    letter-spacing: 3px;
    animation: blink 1.1s ease-in-out infinite;
    margin-bottom: 26px;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.25; }
  }
  #ovl-hints {
    font-size: 13px;
    line-height: 1.9;
    color: #8fa9d9;
    background: rgba(10, 18, 40, 0.6);
    border: 1px solid rgba(90, 140, 255, 0.25);
    border-radius: 8px;
    padding: 12px 26px;
  }
  #ovl-hints b { color: #cfe4ff; }
</style>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>

<div id="wrap">
  <div id="stage">
    <div id="hud">
      <span id="score">0</span>
      <span id="lives"></span>

      <span id="muteind">🔊</span>
    </div>

      <div id="ovl-title">3D BREAKOUT</div>
      <div id="ovl-sub">PRESS SPACE</div>
      <div id="ovl-hints">
        <b>← →</b> or <b>A / D</b> — move paddle &nbsp;·&nbsp; <b>SPACE</b> — launch / pause<br>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============================================================
   CONSTANTS
   ============================================================ */
const W = 800, H = 600;

const LEFT = -6, RIGHT = 6, TOP = 8, FLOOR_Y = -6;
const PADDLE_Y = -4.5;
const PADDLE_W = 2.4, PADDLE_H = 0.3, PADDLE_D = 0.8;
const PADDLE_SPEED = 11;

const BALL_R = 0.25;
const BALL_SPEED = 16;

const COLS = 8, ROWS = 5;
const BRICK_W = 1.3, BRICK_H = 0.55, BRICK_D = 0.9;
const BRICK_X0 = -5.25, BRICK_DX = 1.5;
const BRICK_Y0 = 4.5, BRICK_DY = 0.85;
const ROW_COLORS = [0xff5252, 0xffb74d, 0xffd54f, 0x66bb6a, 0x4fc3f7];

const STATE = { START: 0, READY: 1, PLAYING: 2, PAUSED: 3, GAMEOVER: 4, VICTORY: 5 };

const CAM_BASE = new THREE.Vector3(0, 9, 14);
const CAM_TARGET = new THREE.Vector3(0, 1, 0);
const MAN_YAW = 0, MAN_PITCH = 0.519, MAN_DIST = 16.16;

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
stage.insertBefore(renderer.domElement, stage.firstChild);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080f);
scene.fog = new THREE.Fog(0x06080f, 38, 75);

const camera = new THREE.PerspectiveCamera(60, W / H, 0.1, 100);
camera.position.copy(CAM_BASE);
camera.lookAt(CAM_TARGET);

/* ============================================================
   LIGHTING
   ============================================================ */
scene.add(new THREE.AmbientLight(0x404040, 1.2));

const sun = new THREE.DirectionalLight(0xffffff, 1.7);
sun.position.set(6, 16, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -10;
sun.shadow.camera.right = 10;
sun.shadow.camera.top = 12;
sun.shadow.camera.bottom = -10;
sun.shadow.camera.near = 2;
sun.shadow.camera.far = 45;
sun.shadow.bias = -0.0003;
sun.shadow.normalBias = 0.02;
scene.add(sun);

const rim = new THREE.DirectionalLight(0x4a6cff, 0.5);
rim.position.set(-8, 4, -10);
scene.add(rim);

const ballLight = new THREE.PointLight(0x66d9ff, 1.2, 9, 2);
ballLight.position.set(0, PADDLE_Y + 0.3, 1.5);
scene.add(ballLight);

/* ============================================================
   PROCEDURAL TEXTURES
   ============================================================ */
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

function floorTexture() {
  const c = makeCanvas(512, 512);
  const g = c.getContext('2d');
  g.fillStyle = '#0d1226';
  g.fillRect(0, 0, 512, 512);
  // central radial glow
  let r = g.createRadialGradient(256, 256, 10, 256, 256, 250);
  r.addColorStop(0, 'rgba(70, 110, 220, 0.38)');
  r.addColorStop(0.5, 'rgba(45, 75, 170, 0.15)');
  r.addColorStop(1, 'rgba(0, 0, 0, 0)');
  g.fillStyle = r;
  g.fillRect(0, 0, 512, 512);
  // fine subgrid (32px)
  g.strokeStyle = 'rgba(90, 130, 230, 0.10)';
  g.lineWidth = 1;
  for (let i = 0; i <= 512; i += 32) {
    g.beginPath(); g.moveTo(i + 0.5, 0); g.lineTo(i + 0.5, 512); g.stroke();
    g.beginPath(); g.moveTo(0, i + 0.5); g.lineTo(512, i + 0.5); g.stroke();
  }
  // main grid (64px)
  g.strokeStyle = 'rgba(110, 160, 255, 0.22)';
  g.lineWidth = 1.5;
  for (let i = 0; i <= 512; i += 64) {
    g.beginPath(); g.moveTo(i + 0.5, 0); g.lineTo(i + 0.5, 512); g.stroke();
    g.beginPath(); g.moveTo(0, i + 0.5); g.lineTo(512, i + 0.5); g.stroke();
  }
  // edge vignette
  r = g.createRadialGradient(256, 256, 180, 256, 256, 360);
  r.addColorStop(0, 'rgba(0, 0, 0, 0)');
  r.addColorStop(1, 'rgba(0, 0, 0, 0.6)');
  g.fillStyle = r;
  g.fillRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function brickTexture(rowColor) {
  const c = makeCanvas(256, 96);
  const g = c.getContext('2d');
  g.fillStyle = '#' + rowColor.toString(16).padStart(6, '0');
  g.fillRect(0, 0, 256, 96);
  // vertical gloss gradient: bright top -> dark bottom
  let r = g.createLinearGradient(0, 0, 0, 96);
  r.addColorStop(0, 'rgba(255, 255, 255, 0.38)');
  r.addColorStop(0.45, 'rgba(255, 255, 255, 0.05)');
  r.addColorStop(1, 'rgba(0, 0, 0, 0.32)');
  g.fillStyle = r;
  g.fillRect(0, 0, 256, 96);
  // ~40 subtle random white streaks
  for (let i = 0; i < 40; i++) {
    const x = Math.random() * 256;
    const y = Math.random() * 96;
    const len = 8 + Math.random() * 40;
    const a = 0.03 + Math.random() * 0.08;
    g.strokeStyle = 'rgba(255, 255, 255, ' + a.toFixed(3) + ')';
    g.lineWidth = 1 + Math.random() * 1.5;
    g.beginPath();
    g.moveTo(x, y);
    g.lineTo(x + len, y + (Math.random() - 0.5) * 6);
    g.stroke();
  }
  // bevel border stroke
  g.strokeStyle = 'rgba(255, 255, 255, 0.45)';
  g.lineWidth = 2;
  g.strokeRect(1, 1, 254, 94);
  g.strokeStyle = 'rgba(0, 0, 0, 0.35)';
  g.lineWidth = 1;
  g.strokeRect(3, 3, 250, 90);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function paddleTexture() {
  const c = makeCanvas(256, 64);
  const g = c.getContext('2d');
  let r = g.createLinearGradient(0, 0, 0, 64);
  r.addColorStop(0, '#9feaff');
  r.addColorStop(0.5, '#29c7ff');
  r.addColorStop(1, '#0a6fa8');
  g.fillStyle = r;
  g.fillRect(0, 0, 256, 64);
  // center stripe
  g.fillStyle = 'rgba(255, 255, 255, 0.35)';
  g.fillRect(0, 26, 256, 12);
  // two edge accents
  g.fillStyle = 'rgba(255, 255, 255, 0.55)';
  g.fillRect(8, 6, 6, 52);
  g.fillRect(242, 6, 6, 52);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function backdropTexture() {
  const c = makeCanvas(1024, 512);
  const g = c.getContext('2d');
  let r = g.createLinearGradient(0, 0, 0, 512);
  r.addColorStop(0, '#0a1028');
  r.addColorStop(0.5, '#070b1c');
  r.addColorStop(1, '#03050c');
  g.fillStyle = r;
  g.fillRect(0, 0, 1024, 512);
  // 3 soft nebula radial blobs
  const blobs = [
    { x: 250, y: 200, rad: 220, col: 'rgba(90, 60, 200, 0.20)' },
    { x: 620, y: 300, rad: 260, col: 'rgba(40, 110, 220, 0.16)' },
    { x: 850, y: 140, rad: 180, col: 'rgba(30, 180, 200, 0.13)' }
  ];
  for (const b of blobs) {
    const rg = g.createRadialGradient(b.x, b.y, 10, b.x, b.y, b.rad);
    rg.addColorStop(0, b.col);
    rg.addColorStop(1, 'rgba(0, 0, 0, 0)');
    g.fillStyle = rg;
    g.fillRect(0, 0, 1024, 512);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ============================================================
   ENVIRONMENT: floor, backdrop, starfield, border frame
   ============================================================ */
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(46, 46),
  new THREE.MeshStandardMaterial({ map: floorTexture(), roughness: 0.85, metalness: 0.15 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = FLOOR_Y;
floor.receiveShadow = true;
scene.add(floor);

const backdrop = new THREE.Mesh(
  new THREE.PlaneGeometry(220, 110),
  new THREE.MeshBasicMaterial({ map: backdropTexture(), fog: false })
);
backdrop.position.set(0, 8, -48);
scene.add(backdrop);

{
  const N = 260;
  const pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    pos[i * 3 + 0] = (Math.random() - 0.5) * 90;
    pos[i * 3 + 1] = Math.random() * 34 - 2;
    pos[i * 3 + 2] = -15 - Math.random() * 32;
  }
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const stars = new THREE.Points(sg, new THREE.PointsMaterial({
    color: 0xbfd8ff, size: 0.22, sizeAttenuation: true,
    transparent: true, opacity: 0.85, fog: false
  }));
  scene.add(stars);
}

{
  const pts = [
    new THREE.Vector3(LEFT, FLOOR_Y, 0),
    new THREE.Vector3(RIGHT, FLOOR_Y, 0),
    new THREE.Vector3(RIGHT, TOP, 0),
    new THREE.Vector3(LEFT, TOP, 0)
  ];
  const bg = new THREE.BufferGeometry().setFromPoints(pts);
  const frame = new THREE.LineLoop(bg, new THREE.LineBasicMaterial({
    color: 0x3a5fae, transparent: true, opacity: 0.55
  }));
  scene.add(frame);
}

/* ============================================================
   PADDLE / BALL
   ============================================================ */
const paddle = new THREE.Mesh(
  new RoundedBoxGeometry(PADDLE_W, PADDLE_H, PADDLE_D, 4, 0.1),
  new THREE.MeshStandardMaterial({
    map: paddleTexture(), roughness: 0.35, metalness: 0.3,
    emissive: 0x1a7fb8, emissiveIntensity: 0.25
  })
);
paddle.position.set(0, PADDLE_Y, 0);
paddle.castShadow = true;
scene.add(paddle);

const ballMat = new THREE.MeshStandardMaterial({
  color: 0xe8f6ff, roughness: 0.25, metalness: 0.1,
  emissive: 0x66d9ff, emissiveIntensity: 0.5
});
const ball = new THREE.Mesh(new THREE.SphereGeometry(BALL_R, 24, 18), ballMat);
ball.castShadow = true;
scene.add(ball);

const ballVel = new THREE.Vector3();

/* ---------- ball trail ---------- */
const TRAIL_N = 12;
const trail = [];
const trailGeo = new THREE.SphereGeometry(BALL_R, 10, 8);
for (let i = 0; i < TRAIL_N; i++) {
  const m = new THREE.Mesh(trailGeo, new THREE.MeshBasicMaterial({
    color: 0x66d9ff, transparent: true, opacity: 0
  }));
  m.visible = false;
  scene.add(m);
  trail.push(m);
}
const trailPos = [];
for (let i = 0; i < TRAIL_N; i++) trailPos.push(new THREE.Vector3());

function updateTrail() {
  if (state !== STATE.PLAYING) {
    for (const t of trail) { t.visible = false; t.material.opacity = 0; }
    return;
  }
  // shift oldest out, newest in at index 0
  for (let i = TRAIL_N - 1; i > 0; i--) trailPos[i].copy(trailPos[i - 1]);
  trailPos[0].copy(ball.position);
  for (let i = 0; i < TRAIL_N; i++) {
    const f = 1 - i / TRAIL_N;
    trail[i].visible = true;
    trail[i].position.copy(trailPos[i]);
    trail[i].material.opacity = 0.30 * f * f;
    const s = 0.35 + 0.65 * f;
    trail[i].scale.setScalar(s);
  }
}

/* ---------- particles ---------- */
const PART_MAX = 220;
const partGeo = new THREE.SphereGeometry(0.06, 8, 6);
const particles = [];
for (let i = 0; i < PART_MAX; i++) {
  const m = new THREE.Mesh(partGeo, new THREE.MeshBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0
  }));
  m.visible = false;
  scene.add(m);
  particles.push({ mesh: m, vel: new THREE.Vector3(), life: 0, maxLife: 1 });
}
let partCursor = 0;

function spawnBurst(pos, color) {
  for (let i = 0; i < 10; i++) {
    const p = particles[partCursor];
    partCursor = (partCursor + 1) % PART_MAX;
    p.mesh.visible = true;
    p.mesh.position.copy(pos);
    p.mesh.material.color.setHex(color);
    p.mesh.material.opacity = 1;
    p.vel.set(
      (Math.random() - 0.5) * 6,
      Math.random() * 4 + 1.5,
      (Math.random() - 0.5) * 4
    );
    p.maxLife = 0.55 + Math.random() * 0.35;
    p.life = p.maxLife;
    const s = 0.6 + Math.random() * 0.9;
    p.mesh.scale.setScalar(s);
  }
}

function updateParticles(dt) {
  for (const p of particles) {
    if (!p.mesh.visible) continue;
    p.life -= dt;
    if (p.life <= 0) { p.mesh.visible = false; p.mesh.material.opacity = 0; continue; }
    p.vel.y -= 12 * dt;
    p.mesh.position.addScaledVector(p.vel, dt);
    p.mesh.material.opacity = Math.max(0, p.life / p.maxLife);
  }
}

/* ============================================================
   BRICKS
   ============================================================ */
const brickGeo = new RoundedBoxGeometry(BRICK_W, BRICK_H, BRICK_D, 4, 0.08);
const rowTextures = ROW_COLORS.map(brickTexture);
let bricks = [];

function buildBricks() {
  for (const b of bricks) scene.remove(b.mesh);
  bricks = [];
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const mat = new THREE.MeshStandardMaterial({
        map: rowTextures[row], roughness: 0.5, metalness: 0.1,
        emissive: new THREE.Color(ROW_COLORS[row]), emissiveIntensity: 0.0
      });
      const m = new THREE.Mesh(brickGeo, mat);
      m.position.set(BRICK_X0 + col * BRICK_DX, BRICK_Y0 - row * BRICK_DY, 0);
      m.castShadow = true;
      m.receiveShadow = true;
      scene.add(m);
      bricks.push({
        mesh: m, row, col,
        alive: true, dying: false, dieT: 0,
        color: ROW_COLORS[row]
      });
    }
  }
}
buildBricks();

function killBrick(b) {
  b.alive = false;
  b.dying = true;
  b.dieT = 0;
  spawnBurst(b.mesh.position, b.color);
  beep(660, 'triangle', 0.09, 0.22);
  addScore(10);
}

function updateBricks(dt) {
  let allDead = true;
  for (const b of bricks) {
    if (b.alive) { allDead = false; continue; }
    if (!b.dying) continue;
    b.dieT += dt;
    const t = Math.min(1, b.dieT / 0.25);
    b.mesh.scale.setScalar(Math.max(0.0001, 1 - t));
    b.mesh.material.emissiveIntensity = 1.4 * (1 - t);
    if (t >= 1) {
      b.dying = false;
      b.mesh.visible = false;
    }
  }
  if (allDead && state === STATE.PLAYING) winGame();
}

/* ============================================================
   AUDIO (Web Audio oscillators)
   ============================================================ */
let audioCtx = null;
let muted = false;

function unlockAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function beep(freq, type, dur, vol, delay = 0) {
  if (!audioCtx || muted) return;
  const t0 = audioCtx.currentTime + delay;
  // base layer
  const g1 = audioCtx.createGain();
  g1.gain.setValueAtTime(vol, t0);
  g1.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  g1.connect(audioCtx.destination);
  const o1 = audioCtx.createOscillator();
  o1.type = type;
  o1.frequency.value = freq;
  o1.connect(g1);
  o1.start(t0);
  o1.stop(t0 + dur);
  // quieter octave layer
  const g2 = audioCtx.createGain();
  g2.gain.setValueAtTime(vol * 0.25, t0);
  g2.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  g2.connect(audioCtx.destination);
  const o2 = audioCtx.createOscillator();
  o2.type = type;
  o2.frequency.value = freq * 2;
  o2.connect(g2);
  o2.start(t0);
  o2.stop(t0 + dur);
}

const sfx = {
  paddle() { beep(880, 'square', 0.07, 0.18); },
  brick()  { beep(660, 'triangle', 0.09, 0.22); },
  life()   { beep(220, 'sawtooth', 0.35, 0.22); },
  victory() {
    beep(523, 'sine', 0.18, 0.2, 0);
    beep(659, 'sine', 0.18, 0.2, 0.12);
    beep(784, 'sine', 0.25, 0.2, 0.24);
  }
};

/* ============================================================
   HUD / OVERLAY
   ============================================================ */
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const camEl = document.getElementById('cammode');
const muteEl = document.getElementById('muteind');
const overlayEl = document.getElementById('overlay');
const ovlTitle = document.getElementById('ovl-title');
const ovlSub = document.getElementById('ovl-sub');

function addScore(n) {
  score += n;
  scoreEl.textContent = score;
  scoreEl.classList.remove('pop');
  void scoreEl.offsetWidth;
  scoreEl.classList.add('pop');
}

function renderLives() {
  let html = '';
  for (let i = 0; i < 3; i++) {
    html += i < lives
      ? '<span class="on">♥</span>'
      : '<span class="off">·</span>';
  }
  livesEl.innerHTML = html;
}

function renderCamMode() {
  camEl.textContent = 'CAM: ' + (manualCam ? 'MANUAL' : 'AUTO');
}

function renderMute() {
  muteEl.textContent = muted ? '🔇' : '🔊';
}

function showOverlay(title, sub, hintHtml) {
  ovlTitle.textContent = title;
  ovlSub.textContent = sub;
  document.getElementById('ovl-hints').innerHTML = hintHtml ||
    '<b>← →</b> or <b>A / D</b> — move paddle &nbsp;·&nbsp; <b>SPACE</b> — launch / pause<br>' +
    '<b>C</b> — toggle camera &nbsp;·&nbsp; <b>R</b> — reset camera &nbsp;·&nbsp; <b>M</b> — mute';
  overlayEl.classList.add('show');
}

function hideOverlay() {
  overlayEl.classList.remove('show');
}

/* ============================================================
   GAME STATE
   ============================================================ */
let state = STATE.START;
let score = 0;
let lives = 3;
let elapsed = 0;
let paddleAnimT = -1;      // 0..0.1 while animating, else -1
let camYOff = 0;           // launch Y offset (decays)
let shakeT = 0;            // remaining shake time
let autoCamX = 0;
let manualCam = false;
let manYaw = MAN_YAW, manPitch = MAN_PITCH, manDist = MAN_DIST;

function resetBallToPaddle() {
  ball.position.set(paddle.position.x, PADDLE_Y + PADDLE_H / 2 + BALL_R, 0);
  ballVel.set(0, 0, 0);
  for (const p of trailPos) p.copy(ball.position);
}

function fullReset() {
  score = 0;
  lives = 3;
  scoreEl.textContent = '0';
  renderLives();
  buildBricks();
  paddle.position.set(0, PADDLE_Y, 0);
  paddle.scale.set(1, 1, 1);
  paddleAnimT = -1;
  autoCamX = 0;
  camYOff = 0;
  shakeT = 0;
  resetBallToPaddle();
  state = STATE.START;
  showOverlay('3D BREAKOUT', 'PRESS SPACE');
}

function launchBall() {
  const a = (Math.random() - 0.5) * 0.5;
  ballVel.set(Math.sin(a) * BALL_SPEED, Math.cos(a) * BALL_SPEED, 0);
  camYOff = 0.3;
  sfx.paddle();
}

function loseLife() {
  lives--;
  renderLives();
  sfx.life();
  shakeT = 0.35;
  if (lives <= 0) {
    state = STATE.GAMEOVER;
    showOverlay('GAME OVER', 'PRESS ANY KEY',
      'Final score: <b>' + score + '</b>');
  } else {
    state = STATE.READY;
    resetBallToPaddle();
    showOverlay('READY', 'PRESS SPACE TO LAUNCH');
  }
}

function winGame() {
  state = STATE.VICTORY;
  sfx.victory();
  showOverlay('VICTORY!', 'PRESS ANY KEY',
      'Final score: <b>' + score + '</b>');
}

function onSpace() {
  switch (state) {
    case STATE.START:
      state = STATE.READY;
      resetBallToPaddle();
      showOverlay('READY', 'PRESS SPACE TO LAUNCH');
      break;
    case STATE.READY:
      state = STATE.PLAYING;
      hideOverlay();
      launchBall();
      break;
    case STATE.PLAYING:
      state = STATE.PAUSED;
      showOverlay('PAUSED', 'PRESS SPACE TO RESUME');
      break;
    case STATE.PAUSED:
      state = STATE.PLAYING;
      hideOverlay();
      break;
  }
}

function onAnyKeyOrClick() {
  if (state === STATE.GAMEOVER || state === STATE.VICTORY) {
    fullReset();
  }
}

/* ============================================================
   INPUT
   ============================================================ */
const keys = { left: false, right: false };

window.addEventListener('keydown', (e) => {
  unlockAudio();
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') {
    keys.left = true;
    e.preventDefault();
    return;
  }
  if (k === 'ArrowRight' || k === 'd' || k === 'D') {
    keys.right = true;
    e.preventDefault();
    return;
  }
  if (k === ' ') {
    e.preventDefault();
    if (!e.repeat) {
      onSpace();
      onAnyKeyOrClick();
    }
    return;
  }
  if (k === 'c' || k === 'C') {
    toggleCamera();
    return;
  }
  if (k === 'm' || k === 'M') {
    muted = !muted;
    renderMute();
    return;
  }
  if (k === 'r' || k === 'R') {
    if (manualCam) {
      manYaw = MAN_YAW; manPitch = MAN_PITCH; manDist = MAN_DIST;
    } else {
      autoCamX = 0;
      camYOff = 0;
    }
    return;
  }
  onAnyKeyOrClick();
});

window.addEventListener('keyup', (e) => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
});

renderer.domElement.addEventListener('click', () => {
  unlockAudio();
  onAnyKeyOrClick();
});

/* ---------- manual camera: drag orbit + wheel zoom ---------- */
let dragging = false, lastX = 0, lastY = 0;

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (!manualCam) return;
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!manualCam || !dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;
  manYaw -= dx * 0.005;
  manPitch = Math.min(1.35, Math.max(0.08, manPitch + dy * 0.005));
});
renderer.domElement.addEventListener('pointerup', (e) => {
  dragging = false;
  if (renderer.domElement.hasPointerCapture(e.pointerId)) {
    renderer.domElement.releasePointerCapture(e.pointerId);
  }
});
renderer.domElement.addEventListener('wheel', (e) => {
  if (!manualCam) return;
  e.preventDefault();
  manDist = Math.min(30, Math.max(8, manDist + e.deltaY * 0.02));
}, { passive: false });

function toggleCamera() {
  if (!manualCam) {
    // take over the current auto camera position so there is no jump
    const off = camera.position.clone().sub(CAM_TARGET);
    manDist = off.length();
    manPitch = Math.atan2(off.y, Math.sqrt(off.x * off.x + off.z * off.z));
    manYaw = Math.atan2(off.x, off.z);
    manualCam = true;
  } else {
    manualCam = false;
  }
  renderCamMode();
}

/* ============================================================
   PHYSICS / GAMEPLAY UPDATE
   ============================================================ */
function updatePaddle(dt) {
  let dir = 0;
  if (keys.left) dir -= 1;
  if (keys.right) dir += 1;
  paddle.position.x += dir * PADDLE_SPEED * dt;
  paddle.position.x = Math.min(RIGHT - 1.2, Math.max(LEFT + 1.2, paddle.position.x));
}

function paddleHit() {
  const offset = Math.min(1, Math.max(-1, (ball.position.x - paddle.position.x) / (PADDLE_W / 2)));
  const angle = offset * (Math.PI / 3); // 60 degrees
  ballVel.set(Math.sin(angle) * BALL_SPEED, Math.cos(angle) * BALL_SPEED, 0);
  ball.position.y = PADDLE_Y + PADDLE_H / 2 + BALL_R;
  paddleAnimT = 0;
  sfx.paddle();
}

function updateBall(dt) {
  ball.position.addScaledVector(ballVel, dt);

  // walls
  if (ball.position.x < LEFT + BALL_R) {
    ball.position.x = LEFT + BALL_R;
    ballVel.x = Math.abs(ballVel.x);
  } else if (ball.position.x > RIGHT - BALL_R) {
    ball.position.x = RIGHT - BALL_R;
    ballVel.x = -Math.abs(ballVel.x);
  }
  if (ball.position.y > TOP - BALL_R) {
    ball.position.y = TOP - BALL_R;
    ballVel.y = -Math.abs(ballVel.y);
  }

  // paddle
  const pTop = PADDLE_Y + PADDLE_H / 2;
  if (
    ballVel.y < 0 &&
    ball.position.y - BALL_R <= pTop &&
    ball.position.y + BALL_R >= PADDLE_Y - PADDLE_H / 2 &&
    Math.abs(ball.position.x - paddle.position.x) <= PADDLE_W / 2 + BALL_R
  ) {
    paddleHit();
  }

  // bricks
  for (const b of bricks) {
    if (!b.alive) continue;
    const dx = ball.position.x - b.mesh.position.x;
    const dy = ball.position.y - b.mesh.position.y;
    const px = (BRICK_W / 2 + BALL_R) - Math.abs(dx);
    const py = (BRICK_H / 2 + BALL_R) - Math.abs(dy);
    if (px > 0 && py > 0) {
      if (px < py) {
        ballVel.x = (dx > 0 ? 1 : -1) * Math.abs(ballVel.x);
        ball.position.x += (dx > 0 ? px : -px);
      } else {
        ballVel.y = (dy > 0 ? 1 : -1) * Math.abs(ballVel.y);
        ball.position.y += (dy > 0 ? py : -py);
      }
      killBrick(b);
      break;
    }
  }

  // anti-stall
  if (Math.abs(ballVel.y) < 1.5) {
    ballVel.y = (ballVel.y >= 0 ? 1 : -1) * 1.5;
  }

  // floor
  if (ball.position.y < FLOOR_Y) {
    loseLife();
  }
}

/* ============================================================
   CAMERA
   ============================================================ */
const shakeOff = new THREE.Vector3();

function updateCamera(dt) {
  if (!manualCam) {
    autoCamX += (paddle.position.x * 0.25 - autoCamX) * Math.min(1, dt * 4);
    camYOff *= Math.exp(-dt * 3);
    camera.position.set(autoCamX, CAM_BASE.y + camYOff, CAM_BASE.z);
    camera.lookAt(CAM_TARGET);
  } else {
    const sp = Math.sin(manPitch), cp = Math.cos(manPitch);
    camera.position.set(
      CAM_TARGET.x + manDist * sp * Math.sin(manYaw),
      CAM_TARGET.y + manDist * cp,
      CAM_TARGET.z + manDist * sp * Math.cos(manYaw)
    );
    camera.lookAt(CAM_TARGET);
  }

  // camera shake (applies in both modes)
  if (shakeT > 0) {
    shakeT -= dt;
    const m = Math.max(0, shakeT / 0.35) * 0.3;
    shakeOff.set(
      (Math.random() - 0.5) * 2 * m,
      (Math.random() - 0.5) * 2 * m,
      (Math.random() - 0.5) * 2 * m
    );
    camera.position.add(shakeOff);
  }
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  if (state === STATE.PLAYING) {
    updatePaddle(dt);
    updateBall(dt);
  } else if (state === STATE.READY || state === STATE.START) {
    updatePaddle(dt);
    resetBallToPaddle();
  }

  updateBricks(dt);
  updateParticles(dt);
  updateTrail();

  // paddle squash/stretch (0.1s sine)
  if (paddleAnimT >= 0) {
    paddleAnimT += dt;
    if (paddleAnimT >= 0.1) {
      paddleAnimT = -1;
      paddle.scale.set(1, 1, 1);
    } else {
      const s = Math.sin((paddleAnimT / 0.1) * Math.PI) * 0.3;
      paddle.scale.set(1 + s, 1 - s, 1);
    }
  }

  // ball emissive pulse while playing
  if (state === STATE.PLAYING) {
    ballMat.emissiveIntensity = 0.4 + 0.35 * (0.5 + 0.5 * Math.sin(elapsed * 8));
  } else {
    ballMat.emissiveIntensity = 0.5;
  }

  // ball-following point light
  ballLight.position.set(ball.position.x, ball.position.y + 0.3, 1.5);

  updateCamera(dt);

  renderer.render(scene, camera);
}

/* ---------- boot ---------- */
fullReset();
renderMute();
renderCamMode();
animate();
</script>
</body>
</html>
