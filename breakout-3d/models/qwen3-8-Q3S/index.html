<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breakout 3D</title>
<style>
  :root {
    --accent: #4fc3f7;
    --accent2: #b388ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #030409;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage {
    position: relative;
    width: 800px;
    height: 600px;
    box-shadow: 0 0 60px rgba(30, 80, 200, 0.25), 0 0 0 1px rgba(90, 140, 255, 0.15);
    border-radius: 6px;
    overflow: hidden;
    background: #06080f;
  }
  #stage canvas { display: block; width: 800px; height: 600px; }

  /* ---------- HUD ---------- */
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 10px 14px;
    pointer-events: none;
    color: #cfe3ff;
    text-shadow: 0 0 8px rgba(79, 195, 247, 0.55), 0 1px 2px rgba(0,0,0,0.8);
    z-index: 10;
  }
  .hud-box {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 110px;
  }
  .hud-label {
    font-size: 10px;
    letter-spacing: 2px;
    color: #6f87b8;
  }
  #scoreVal {
    font-size: 26px;
    font-weight: 700;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
    transform-origin: left center;
  }
  #scoreVal.pop { animation: scorePop 0.25s ease-out; }
  @keyframes scorePop {
    0%   { transform: scale(1);    color: #ffffff; }
    35%  { transform: scale(1.35); color: #ffe082; }
    100% { transform: scale(1);    color: #ffffff; }
  }
  #livesVal { font-size: 20px; letter-spacing: 3px; color: #ff5c7a; }
  #livesVal .dead { color: #3a4666; }
  #rightHud {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    font-size: 12px;
    letter-spacing: 1px;
  }
  #camMode { color: #8fd3ff; }
  #muteInd { color: #7f9ec9; }

  /* ---------- Overlay screens ---------- */
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: radial-gradient(ellipse at center, rgba(6, 10, 24, 0.55) 0%, rgba(4, 6, 14, 0.82) 100%);
    z-index: 20;
    transition: opacity 0.2s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #ovTitle {
    font-size: 58px;
    font-weight: 800;
    letter-spacing: 6px;
    background: linear-gradient(180deg, #ffffff 0%, #7fd4ff 45%, #4a6cff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 18px rgba(79, 195, 247, 0.6));
  }
  #ovSub {
    font-size: 16px;
    letter-spacing: 4px;
    color: #9fc4ef;
    animation: blink 1.1s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.25; }
  }
  #ovHints {
    margin-top: 6px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 12px;
    color: #6f87b8;
    letter-spacing: 1px;
    text-align: center;
  }
  #ovHints b {
    color: #b8d4f5;
    background: rgba(79, 195, 247, 0.12);
    border: 1px solid rgba(79, 195, 247, 0.35);
    border-radius: 4px;
    padding: 1px 7px;
    font-family: inherit;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div id="hud">
      <div class="hud-box">
        <span class="hud-label">SCORE</span>
        <span id="scoreVal">0</span>
      </div>
      <div class="hud-box" style="align-items:center">
        <span class="hud-label">LIVES</span>
        <span id="livesVal">♥♥♥</span>
      </div>
      <div id="rightHud">
        <span id="camMode">CAM: AUTO</span>
        <span id="muteInd">🔊</span>
      </div>
    </div>
    <div id="overlay" class="hidden">
      <div id="ovTitle">BREAKOUT 3D</div>
      <div id="ovSub">PRESS SPACE</div>

        <div><b>← →</b> / <b>A D</b> move &nbsp;·&nbsp; <b>SPACE</b> launch / pause</div>
        <div><b>C</b> camera &nbsp;·&nbsp; <b>drag</b> orbit &nbsp;·&nbsp; <b>wheel</b> zoom &nbsp;·&nbsp; <b>R</b> reset cam &nbsp;·&nbsp; <b>M</b> mute</div>
      </div>
    </div>
  </div>
</div>

<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============================== CONSTANTS ============================== */
const W = 800, H = 600;

const LEFT = -6, RIGHT = 6, TOP = 8, FLOOR_Y = -6;
const PADDLE_Y = -4.5;
const PADDLE_W = 2.4, PADDLE_H = 0.3, PADDLE_D = 0.8;
const PADDLE_SPEED = 11;
const BALL_R = 0.25;
const BALL_SPEED = 16;

const BRICK_COLS = 8, BRICK_ROWS = 5;
const BRICK_W = 1.3, BRICK_H = 0.55, BRICK_D = 0.9;
const BRICK_X0 = -5.25, BRICK_DX = 1.5;
const BRICK_Y0 = 4.5, BRICK_DY = 0.85;
const ROW_COLORS = [0xff5252, 0xffb74d, 0xffd54f, 0x66bb6a, 0x4fc3f7];

const STATE = { START: 0, READY: 1, PLAYING: 2, PAUSED: 3, GAMEOVER: 4, VICTORY: 5 };

const CAM_BASE = new THREE.Vector3(0, 9, 14);
const CAM_TARGET = new THREE.Vector3(0, 1, 0);
const MANUAL_DEFAULT = { yaw: 0, pitch: 0.519, dist: 16.16 };

/* ============================== RENDERER ============================== */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.insertBefore(renderer.domElement, stage.firstChild);

/* ============================== SCENE / CAMERA ============================== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080f);
scene.fog = new THREE.Fog(0x06080f, 38, 75);

const camera = new THREE.PerspectiveCamera(60, W / H, 0.1, 100);
camera.position.copy(CAM_BASE);
camera.lookAt(CAM_TARGET);

/* ============================== LIGHTING ============================== */
scene.add(new THREE.AmbientLight(0x404040, 1.2));

const sun = new THREE.DirectionalLight(0xffffff, 1.7);
sun.position.set(6, 16, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -10;
sun.shadow.camera.right = 10;
sun.shadow.camera.top = 12;
sun.shadow.camera.bottom = -10;
sun.shadow.camera.near = 2;
sun.shadow.camera.far = 45;
sun.shadow.bias = -0.0003;
sun.shadow.normalBias = 0.02;
scene.add(sun);

const rim = new THREE.DirectionalLight(0x4a6cff, 0.5);
rim.position.set(-8, 4, -10);
scene.add(rim);

const ballLight = new THREE.PointLight(0x66d9ff, 1.2, 9, 2);
ballLight.position.set(0, PADDLE_Y + 0.3, 1.5);
scene.add(ballLight);

/* ============================== CANVAS HELPERS ============================== */
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return { canvas: c, ctx: c.getContext('2d') };
}
function hexToRgb(hex) {
  return { r: (hex >> 16) & 255, g: (hex >> 8) & 255, b: hex & 255 };
}
function shade(hex, amt) {
  const { r, g, b } = hexToRgb(hex);
  const f = v => Math.max(0, Math.min(255, Math.round(v + amt)));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function rgba(hex, a) {
  const { r, g, b } = hexToRgb(hex);
  return `rgba(${r},${g},${b},${a})`;
}

/* ============================== FLOOR ============================== */
{
  const { canvas, ctx } = makeCanvas(512, 512);
  ctx.fillStyle = '#0d1226';
  ctx.fillRect(0, 0, 512, 512);

  // central radial glow
  let g = ctx.createRadialGradient(256, 256, 20, 256, 256, 260);
  g.addColorStop(0, 'rgba(70,120,255,0.30)');
  g.addColorStop(0.5, 'rgba(50,90,220,0.12)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 512, 512);

  // fine subgrid (32px)
  ctx.strokeStyle = 'rgba(90,130,255,0.10)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i <= 512; i += 32) {
    ctx.moveTo(i + 0.5, 0); ctx.lineTo(i + 0.5, 512);
    ctx.moveTo(0, i + 0.5); ctx.lineTo(512, i + 0.5);
  }
  ctx.stroke();

  // main grid (64px)
  ctx.strokeStyle = 'rgba(120,160,255,0.22)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i <= 512; i += 64) {
    ctx.moveTo(i + 0.5, 0); ctx.lineTo(i + 0.5, 512);
    ctx.moveTo(0, i + 0.5); ctx.lineTo(512, i + 0.5);
  }
  ctx.stroke();

  // edge vignette
  g = ctx.createRadialGradient(256, 256, 180, 256, 256, 360);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.75)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 512, 512);

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;

  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(46, 46),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9, metalness: 0.1 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = FLOOR_Y;
  floor.receiveShadow = true;
  scene.add(floor);
}

/* ============================== BACKDROP ============================== */
{
  const { canvas, ctx } = makeCanvas(1024, 512);
  const g = ctx.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0, '#0a1028');
  g.addColorStop(0.5, '#070b1c');
  g.addColorStop(1, '#03050c');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 1024, 512);

  const blobs = [
    { x: 250, y: 180, r: 220, c: 'rgba(80, 60, 200, 0.20)' },
    { x: 640, y: 300, r: 260, c: 'rgba(30, 120, 200, 0.16)' },
    { x: 850, y: 130, r: 180, c: 'rgba(190, 60, 160, 0.12)' }
  ];
  for (const b of blobs) {
    const rg = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    rg.addColorStop(0, b.c);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, 1024, 512);
  }

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  const backdrop = new THREE.Mesh(
    new THREE.PlaneGeometry(220, 110),
    new THREE.MeshBasicMaterial({ map: tex, fog: false })
  );
  backdrop.position.set(0, 8, -48);
  scene.add(backdrop);
}

/* ============================== STARFIELD ============================== */
{
  const N = 260;
  const pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    pos[i * 3 + 0] = (Math.random() - 0.5) * 130;
    pos[i * 3 + 1] = -8 + Math.random() * 48;
    pos[i * 3 + 2] = -45 + Math.random() * 30; // behind the playfield
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const stars = new THREE.Points(geo, new THREE.PointsMaterial({
    color: 0x9fb8ff, size: 0.18, sizeAttenuation: true,
    transparent: true, opacity: 0.85, fog: true
  }));
  scene.add(stars);
}

/* ============================== BORDER FRAME ============================== */
{
  const z = -0.55;
  const pts = [
    new THREE.Vector3(LEFT, FLOOR_Y, z),
    new THREE.Vector3(RIGHT, FLOOR_Y, z),
    new THREE.Vector3(RIGHT, TOP, z),
    new THREE.Vector3(LEFT, TOP, z)
  ];
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const border = new THREE.LineLoop(geo, new THREE.LineBasicMaterial({
    color: 0x35507e, transparent: true, opacity: 0.7
  }));
  scene.add(border);
}

/* ============================== PADDLE ============================== */
{
  const { canvas, ctx } = makeCanvas(256, 64);
  const g = ctx.createLinearGradient(0, 0, 0, 64);
  g.addColorStop(0, '#9feaff');
  g.addColorStop(0.5, '#29c7ff');
  g.addColorStop(1, '#0a6fa8');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 64);

  // center stripe
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillRect(0, 28, 256, 8);
  ctx.fillStyle = 'rgba(10,60,120,0.5)';
  ctx.fillRect(0, 36, 256, 2);

  // two edge accents
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillRect(6, 6, 8, 52);
  ctx.fillRect(242, 6, 8, 52);
  ctx.fillStyle = 'rgba(0,20,60,0.6)';
  ctx.fillRect(14, 6, 3, 52);
  ctx.fillRect(239, 6, 3, 52);

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;

  const paddle = new THREE.Mesh(
    new RoundedBoxGeometry(PADDLE_W, PADDLE_H, PADDLE_D, 4, 0.1),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 0.35, metalness: 0.3 })
  );
  paddle.position.set(0, PADDLE_Y, 0);
  paddle.castShadow = true;
  scene.add(paddle);
  window.__paddle = paddle;
}
const paddle = window.__paddle;

/* ============================== BALL ============================== */
const ball = new THREE.Mesh(
  new THREE.SphereGeometry(BALL_R, 32, 24),
  new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: 0.25, metalness: 0.1,
    emissive: new THREE.Color(0x66d9ff), emissiveIntensity: 0.4
  })
);
ball.castShadow = true;
ball.position.set(0, PADDLE_Y + PADDLE_H / 2 + BALL_R, 0);
scene.add(ball);

const ballVel = new THREE.Vector3(0, 0, 0);

/* ball trail */
const TRAIL_N = 12;
const trail = [];
{
  const ghostGeo = new THREE.SphereGeometry(BALL_R, 12, 8);
  for (let i = 0; i < TRAIL_N; i++) {
    const m = new THREE.Mesh(ghostGeo, new THREE.MeshBasicMaterial({
      color: 0x66d9ff, transparent: true, opacity: 0, depthWrite: false
    }));
    m.visible = false;
    scene.add(m);
    trail.push(m);
  }
}
let trailBuf = []; // ring of recent positions
let trailTick = 0;

/* ============================== BRICKS ============================== */
const bricks = [];

function makeBrickTexture(rowColor) {
  const { canvas, ctx } = makeCanvas(256, 96);
  ctx.fillStyle = shade(rowColor, 0);
  ctx.fillRect(0, 0, 256, 96);

  // vertical gloss: bright top -> dark bottom
  const g = ctx.createLinearGradient(0, 0, 0, 96);
  g.addColorStop(0, 'rgba(255,255,255,0.55)');
  g.addColorStop(0.35, 'rgba(255,255,255,0.08)');
  g.addColorStop(0.7, 'rgba(0,0,0,0.10)');
  g.addColorStop(1, 'rgba(0,0,0,0.40)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 96);

  // ~40 subtle random white streaks
  for (let i = 0; i < 40; i++) {
    const x = Math.random() * 256;
    const y = Math.random() * 96;
    const len = 8 + Math.random() * 34;
    ctx.strokeStyle = `rgba(255,255,255,${0.03 + Math.random() * 0.07})`;
    ctx.lineWidth = 1 + Math.random() * 2;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + len, y + (Math.random() - 0.5) * 6);
    ctx.stroke();
  }

  // bevel border stroke
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 3;
  ctx.strokeRect(2, 2, 252, 92);
  ctx.strokeStyle = 'rgba(0,0,0,0.45)';
  ctx.lineWidth = 2;
  ctx.strokeRect(5, 5, 246, 86);

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const brickTextures = ROW_COLORS.map(makeBrickTexture);

function buildBricks() {
  for (const b of bricks) scene.remove(b.mesh);
  bricks.length = 0;
  const geo = new RoundedBoxGeometry(BRICK_W, BRICK_H, BRICK_D, 4, 0.08);
  for (let row = 0; row < BRICK_ROWS; row++) {
    for (let col = 0; col < BRICK_COLS; col++) {
      const mat = new THREE.MeshStandardMaterial({
        map: brickTextures[row],
        roughness: 0.45,
        metalness: 0.15,
        emissive: new THREE.Color(ROW_COLORS[row]),
        emissiveIntensity: 0
      });
      const mesh = new THREE.Mesh(geo, mat);
      const x = BRICK_X0 + col * BRICK_DX;
      const y = BRICK_Y0 - row * BRICK_DY;
      mesh.position.set(x, y, 0);
      mesh.castShadow = true;
      scene.add(mesh);
      bricks.push({
        mesh, mat, row, col, x, y,
        alive: true,
        dying: false, deathT: 0
      });
    }
  }
}
buildBricks();

/* ============================== PARTICLES ============================== */
const particles = [];
{
  const pGeo = new THREE.SphereGeometry(0.06, 8, 6);
  for (let i = 0; i < 240; i++) {
    const m = new THREE.Mesh(pGeo, new THREE.MeshBasicMaterial({
      color: 0xffffff, transparent: true, opacity: 1
    }));
    m.visible = false;
    scene.add(m);
    particles.push({ mesh: m, vel: new THREE.Vector3(), life: 0, maxLife: 1 });
  }
}
function spawnBurst(x, y, colorHex) {
  let spawned = 0;
  for (const p of particles) {
    if (p.life > 0) continue;
    p.life = p.maxLife = 0.5 + Math.random() * 0.3;
    p.mesh.visible = true;
    p.mesh.position.set(x, y, 0.1);
    p.mesh.material.color.setHex(colorHex);
    p.mesh.material.opacity = 1;
    const a = Math.random() * Math.PI * 2;
    const s = 2 + Math.random() * 4;
    p.vel.set(Math.cos(a) * s, Math.sin(a) * s, (Math.random() - 0.5) * 2);
    if (++spawned >= 10) break;
  }
}
function updateParticles(dt) {
  for (const p of particles) {
    if (p.life <= 0) continue;
    p.life -= dt;
    if (p.life <= 0) { p.mesh.visible = false; continue; }
    p.vel.y -= 14 * dt;
    p.mesh.position.addScaledVector(p.vel, dt);
    p.mesh.material.opacity = Math.max(0, p.life / p.maxLife);
    const s = 0.6 + 0.4 * (p.life / p.maxLife);
    p.mesh.scale.setScalar(s);
  }
}

/* ============================== AUDIO ============================== */
let audioCtx = null;
let muted = false;
function unlockAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, type, dur, vol, delay = 0) {
  if (!audioCtx || muted) return;
  const t0 = audioCtx.currentTime + delay;
  const layers = [
    { f: freq, v: vol },
    { f: freq * 2, v: vol * 0.25 }
  ];
  for (const L of layers) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = L.f;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(L.v, t0 + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
}
const sfx = {
  paddle: () => beep(880, 'square', 0.07, 0.18),
  brick: () => beep(660, 'triangle', 0.09, 0.22),
  life: () => beep(220, 'sawtooth', 0.35, 0.22),
  victory: () => {
    beep(523, 'sine', 0.18, 0.22, 0);
    beep(659, 'sine', 0.18, 0.22, 0.12);
    beep(784, 'sine', 0.25, 0.22, 0.24);
  }
};

/* ============================== GAME STATE ============================== */
let state = STATE.START;
let score = 0;
let lives = 3;
let elapsed = 0;

let paddleSquashT = 0;   // counts down from 0.1
let shakeT = 0;          // counts down from 0.35
let shakeMag = 0;
let launchY = 0;         // decays via exp(-dt*3)

/* camera */
let camMode = 'auto';
let autoCamX = 0;
let orbit = { ...MANUAL_DEFAULT };

/* HUD */
const scoreEl = document.getElementById('scoreVal');
const livesEl = document.getElementById('livesVal');
const camEl = document.getElementById('camMode');
const muteEl = document.getElementById('muteInd');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovSub = document.getElementById('ovSub');
const ovHints = document.getElementById('ovHints');

function updateScoreHUD() {
  scoreEl.textContent = String(score);
  scoreEl.classList.remove('pop');
  void scoreEl.offsetWidth;
  scoreEl.classList.add('pop');
}
function updateLivesHUD() {
  let s = '';
  for (let i = 0; i < 3; i++) {
    s += i < lives ? '♥' : '<span class="dead">·</span>';
  }
  livesEl.innerHTML = s;
}
function updateCamHUD() {
  camEl.textContent = camMode === 'auto' ? 'CAM: AUTO' : 'CAM: MANUAL';
}
function updateMuteHUD() {
  muteEl.textContent = muted ? '🔇' : '🔊';
}
function showOverlay(title, sub, hints) {
  ovTitle.textContent = title;
  ovSub.textContent = sub;
  ovHints.innerHTML = hints
    ? hints.map(h => `<div><b>${h[0]}</b> ${h[1]}</div>`).join('')
    : '<div>&nbsp;</div>';
  overlay.classList.remove('hidden');
}
function hideOverlay() {
  overlay.classList.add('hidden');
}

function resetBallOnPaddle() {
  ball.position.set(paddle.position.x, PADDLE_Y + PADDLE_H / 2 + BALL_R, 0);
  ballVel.set(0, 0, 0);
  trailBuf = [];
  trailTick = 0;
  for (const g of trail) { g.visible = false; g.material.opacity = 0; }
}

function launchBall() {
  const a = (Math.random() - 0.5) * 0.5;
  ballVel.set(Math.sin(a) * BALL_SPEED, Math.cos(a) * BALL_SPEED, 0);
  launchY = 0.3;
  state = STATE.PLAYING;
  hideOverlay();
}

function loseLife() {
  lives--;
  updateLivesHUD();
  sfx.life();
  shakeT = 0.35;
  shakeMag = 0.35;
  if (lives <= 0) {
    state = STATE.GAMEOVER;
    for (const g of trail) g.visible = false;
    showOverlay('GAME OVER', 'PRESS ANY KEY', [
      ['SPACE', 'restart']
    ]);
  } else {
    state = STATE.READY;
    resetBallOnPaddle();
  }
}

function victory() {
  state = STATE.VICTORY;
  sfx.victory();
  for (const g of trail) g.visible = false;
  showOverlay('VICTORY!', 'PRESS ANY KEY', [
    ['SPACE', 'play again']
  ]);
}

function fullReset() {
  score = 0;
  lives = 3;
  scoreEl.textContent = '0';
  updateLivesHUD();
  buildBricks();
  paddle.position.x = 0;
  autoCamX = 0;
  launchY = 0;
  shakeT = 0;
  paddleSquashT = 0;
  for (const p of particles) { p.life = 0; p.mesh.visible = false; }
  resetBallOnPaddle();
  state = STATE.START;
  showOverlay('BREAKOUT 3D', 'PRESS SPACE', [
    ['← → / A D', 'move'], ['SPACE', 'launch'], ['C', 'camera'], ['M', 'mute']
  ]);
}

/* ============================== INPUT ============================== */
const keys = {};

function onKey(e) {
  unlockAudio();
  const code = e.code;
  if (code === 'Space' || code === 'ArrowLeft' || code === 'ArrowRight') e.preventDefault();
  if (keys[code]) return;
  keys[code] = true;

  if (code === 'KeyM') {
    muted = !muted;
    updateMuteHUD();
    return;
  }
  if (code === 'KeyC') {
    if (camMode === 'auto') {
      // take over the current auto camera position so there is no jump
      const off = camera.position.clone().sub(CAM_TARGET);
      const dist = off.length();
      orbit.dist = THREE.MathUtils.clamp(dist, 8, 30);
      orbit.pitch = THREE.MathUtils.clamp(Math.asin(off.y / dist), 0.08, 1.35);
      orbit.yaw = Math.atan2(off.x, off.z);
      camMode = 'manual';
    } else {
      camMode = 'auto';
    }
    updateCamHUD();
    return;
  }
  if (code === 'KeyR') {
    if (camMode === 'manual') {
      orbit = { ...MANUAL_DEFAULT };
    } else {
      autoCamX = 0;
      launchY = 0;
    }
    return;
  }

  switch (state) {
    case STATE.START:
      if (code === 'Space') {
        state = STATE.READY;
        resetBallOnPaddle();
        hideOverlay();
      }
      break;
    case STATE.READY:
      if (code === 'Space') launchBall();
      break;
    case STATE.PLAYING:
      if (code === 'Space') {
        state = STATE.PAUSED;
        showOverlay('PAUSED', 'PRESS SPACE', [['SPACE', 'resume']]);
      }
      break;
    case STATE.PAUSED:
      if (code === 'Space') {
        state = STATE.PLAYING;
        hideOverlay();
      }
      break;
    case STATE.GAMEOVER:
    case STATE.VICTORY:
      fullReset();
      break;
  }
}

function onPointerDown(e) {
  unlockAudio();
  if (state === STATE.GAMEOVER || state === STATE.VICTORY) {
    fullReset();
    return;
  }
  if (camMode === 'manual') {
    dragging = true;
    dragX = e.clientX;
    dragY = e.clientY;
  }
}
function onPointerMove(e) {
  if (!dragging || camMode !== 'manual') return;
  const dx = e.clientX - dragX;
  const dy = e.clientY - dragY;
  dragX = e.clientX;
  dragY = e.clientY;
  orbit.yaw -= dx * 0.005;
  orbit.pitch = THREE.MathUtils.clamp(orbit.pitch + dy * 0.005, 0.08, 1.35);
}
function onPointerUp() { dragging = false; }
function onWheel(e) {
  e.preventDefault();
  if (camMode !== 'manual') return;
  orbit.dist = THREE.MathUtils.clamp(orbit.dist * (1 + e.deltaY * 0.001), 8, 30);
}

window.addEventListener('keydown', onKey);
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerup', onPointerUp);
renderer.domElement.addEventListener('wheel', onWheel, { passive: false });

let dragging = false, dragX = 0, dragY = 0;

/* ============================== PHYSICS ============================== */
function reflectPaddle() {
  const offset = THREE.MathUtils.clamp((ball.position.x - paddle.position.x) / (PADDLE_W / 2), -1, 1);
  const angle = offset * (Math.PI / 3); // 60 degrees
  ballVel.set(Math.sin(angle) * BALL_SPEED, Math.cos(angle) * BALL_SPEED, 0);
  paddleSquashT = 0.1;
  sfx.paddle();
}

function hitBrick(b) {
  b.alive = false;
  b.dying = true;
  b.deathT = 0.25;
  score += 10;
  updateScoreHUD();
  sfx.brick();
  spawnBurst(b.x, b.y, ROW_COLORS[b.row]);
  if (bricks.every(x => !x.alive)) victory();
}

function stepBall(dt) {
  ball.position.addScaledVector(ballVel, dt);

  // walls
  if (ball.position.x - BALL_R < LEFT && ballVel.x < 0) {
    ball.position.x = LEFT + BALL_R;
    ballVel.x = -ballVel.x;
  } else if (ball.position.x + BALL_R > RIGHT && ballVel.x > 0) {
    ball.position.x = RIGHT - BALL_R;
    ballVel.x = -ballVel.x;
  }
  if (ball.position.y + BALL_R > TOP && ballVel.y > 0) {
    ball.position.y = TOP - BALL_R;
    ballVel.y = -ballVel.y;
  }

  // paddle
  const px = paddle.position.x;
  const padTop = PADDLE_Y + PADDLE_H / 2;
  if (
    ballVel.y < 0 &&
    ball.position.y - BALL_R <= padTop &&
    ball.position.y - BALL_R > PADDLE_Y - PADDLE_H &&
    Math.abs(ball.position.x - px) <= PADDLE_W / 2 + BALL_R
  ) {
    ball.position.y = padTop + BALL_R;
    reflectPaddle();
  }

  // bricks
  for (const b of bricks) {
    if (!b.alive) continue;
    const dx = ball.position.x - b.x;
    const dy = ball.position.y - b.y;
    const ox = (BALL_R + BRICK_W / 2) - Math.abs(dx);
    const oy = (BALL_R + BRICK_H / 2) - Math.abs(dy);
    if (ox > 0 && oy > 0) {
      if (ox < oy) {
        ballVel.x = dx > 0 ? Math.abs(ballVel.x) : -Math.abs(ballVel.x);
        ball.position.x = dx > 0 ? b.x + BRICK_W / 2 + BALL_R : b.x - BRICK_W / 2 - BALL_R;
      } else {
        ballVel.y = dy > 0 ? Math.abs(ballVel.y) : -Math.abs(ballVel.y);
        ball.position.y = dy > 0 ? b.y + BRICK_H / 2 + BALL_R : b.y - BRICK_H / 2 - BALL_R;
      }
      hitBrick(b);
      break;
    }
  }

  // anti-stall
  if (Math.abs(ballVel.y) < 1.5) {
    ballVel.y = (ballVel.y < 0 ? -1 : 1) * 1.5;
  }

  // floor
  if (ball.position.y - BALL_R < FLOOR_Y) {
    loseLife();
  }
}

function updateBall(dt) {
  const steps = Math.max(1, Math.ceil(dt / (1 / 120)));
  const h = dt / steps;
  for (let i = 0; i < steps; i++) {
    if (state !== STATE.PLAYING) break;
    stepBall(h);
  }
}

/* ============================== CAMERA ============================== */
function updateCamera(dt) {
  let pos;
  if (camMode === 'auto') {
    autoCamX += (paddle.position.x * 0.25 - autoCamX) * Math.min(1, dt * 4);
    launchY *= Math.exp(-dt * 3);
    pos = new THREE.Vector3(autoCamX, CAM_BASE.y + launchY, CAM_BASE.z);
  } else {
    const cp = Math.cos(orbit.pitch), sp = Math.sin(orbit.pitch);
    const cy = Math.cos(orbit.yaw), sy = Math.sin(orbit.yaw);
    pos = CAM_TARGET.clone().add(
      new THREE.Vector3(orbit.dist * cp * sy, orbit.dist * sp, orbit.dist * cp * cy)
    );
  }
  if (shakeT > 0) {
    shakeT -= dt;
    const k = Math.max(0, shakeT) / 0.35;
    const m = shakeMag * k;
    pos.x += (Math.random() - 0.5) * 2 * m;
    pos.y += (Math.random() - 0.5) * 2 * m;
    pos.z += (Math.random() - 0.5) * 2 * m;
  }
  camera.position.copy(pos);
  camera.lookAt(CAM_TARGET);
}

/* ============================== MAIN LOOP ============================== */
const clock = new THREE.Clock();

function update(dt) {
  elapsed += dt;

  // paddle movement (READY + PLAYING)
  if (state === STATE.READY || state === STATE.PLAYING) {
    let dir = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) dir -= 1;
    if (keys['ArrowRight'] || keys['KeyD']) dir += 1;
    paddle.position.x = THREE.MathUtils.clamp(
      paddle.position.x + dir * PADDLE_SPEED * dt,
      LEFT + 1.2, RIGHT - 1.2
    );
  }

  // ball follows paddle in READY
  if (state === STATE.READY) {
    ball.position.set(paddle.position.x, PADDLE_Y + PADDLE_H / 2 + BALL_R, 0);
    ballLight.position.set(ball.position.x, ball.position.y + 0.3, 1.5);
  }

  if (state === STATE.PLAYING) {
    updateBall(dt);
    ballLight.position.set(ball.position.x, ball.position.y + 0.3, 1.5);
  }

  // ball emissive pulse while playing
  ball.material.emissiveIntensity =
    state === STATE.PLAYING
      ? 0.4 + 0.35 * (0.5 + 0.5 * Math.sin(elapsed * 8))
      : 0.4;

  // trail
  if (state === STATE.PLAYING) {
    trailTick -= dt;
    if (trailTick <= 0) {
      trailTick = 1 / 30;
      trailBuf.push(ball.position.clone());
      if (trailBuf.length > TRAIL_N) trailBuf.shift();
    }
  } else {
    trailBuf = [];
  }
  for (let i = 0; i < TRAIL_N; i++) {
    const g = trail[i];
    const idx = trailBuf.length - 1 - i;
    if (idx >= 0) {
      g.visible = true;
      g.position.copy(trailBuf[idx]);
      g.material.opacity = (1 - i / TRAIL_N) * 0.28;
      const s = 1 - (i / TRAIL_N) * 0.6;
      g.scale.setScalar(s);
    } else {
      g.visible = false;
      g.material.opacity = 0;
    }
  }

  // paddle squash/stretch
  if (paddleSquashT > 0) {
    paddleSquashT = Math.max(0, paddleSquashT - dt);
    const p = 1 - paddleSquashT / 0.1;
    const w = Math.sin(Math.PI * p);
    paddle.scale.set(1 + 0.22 * w, 1 - 0.28 * w, 1);
  } else {
    paddle.scale.set(1, 1, 1);
  }

  // brick death animations
  for (const b of bricks) {
    if (!b.dying) continue;
    b.deathT -= dt;
    const t = Math.max(0, b.deathT) / 0.25;
    const s = Math.max(0.0001, t);
    b.mesh.scale.setScalar(s);
    b.mat.emissiveIntensity = 1.6 * t;
    if (b.deathT <= 0) {
      b.mesh.visible = false;
      b.dying = false;
      b.mat.emissiveIntensity = 0;
    }
  }

  updateParticles(dt);
  updateCamera(dt);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  renderer.render(scene, camera);
}

/* ============================== BOOT ============================== */
updateLivesHUD();
updateCamHUD();
updateMuteHUD();
showOverlay('BREAKOUT 3D', 'PRESS SPACE', [
  ['← → / A D', 'move'], ['SPACE', 'launch'], ['C', 'camera'], ['M', 'mute']
]);
animate();
</script>
</body>
</html>
